# Replaces the body of one GitHub Release (@softure-ai/deploy, issue #406): a reusable workflow an app calls from a
# `workflow_dispatch` with the inputs `tag` and `body`. An agent's cloud session cannot edit a release through the
# REST API, but it can start a workflow_dispatch; so can the owner from the Actions tab.
#
# The caller is `tools/deploy/examples/release-notes.yml` in this repository (`softure-deploy init` writes it as
# `.github/workflows/release-notes.yml`). It grants `contents: write`, which the one job needs to edit the release.
# The body reaches `gh` through a file, byte for byte; nothing is interpolated into a script.
#
# With `keep-report: true` (issue #436) the job keeps the sections `softure-deploy release-notes` and `report` wrote:
# it writes `body`, a blank line, then the current body from its first `<!-- softure-deploy:` marker on, unchanged.
# A current body without a marker is replaced whole, as without the input.

name: deploy-release-notes

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner of every job as JSON, one label or an array of labels (e.g. "ubuntu-latest" or ["self-hosted","linux"])
        type: string
        default: '"ubuntu-latest"'
      tag:
        description: The tag of the release whose body is replaced
        type: string
        required: true
      body:
        description: The new body, markdown; it replaces the whole body, or the text above the report with keep-report
        type: string
        required: true
      keep-report:
        description: Keep the softure-deploy sections of the current body (from the first marker on) below the new body
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  notes:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: write # gh release edit
    concurrency:
      group: deploy-release-notes-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check the runner
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # GitHub picked this runner from the value already, so a value that is not JSON never gets here; this step
        # refuses the JSON that GitHub takes but the input does not mean (an object, an empty array, a number).
        run: |
          label='"[^"\\]+"'
          space='[[:space:]]*'
          pattern="^$space($label|\\[$space$label($space,$space$label)*$space\\])$space\$"
          if [[ ! "$RUNS_ON" =~ $pattern ]]; then
            echo "::error::Input runs-on is not valid: a JSON label such as '\"ubuntu-latest\"' or a non-empty array of labels such as '[\"self-hosted\",\"linux\"]'"
            exit 1
          fi

      # GitHub's hosted images ship the GitHub CLI, a self-hosted runner may not (issue #686): without it, this installs
      # a pinned copy into RUNNER_TEMP for this job only, checked against its SHA-256 first, with no sudo.
      - name: Set up the GitHub CLI
        run: |
          if command -v gh > /dev/null; then
            exit 0
          fi
          version=2.103.0
          case "$RUNNER_OS $RUNNER_ARCH" in
            "Linux X64") arch=amd64 sum=fdd768eb70f6409f80fcfa9f3a1c0adf0fc98d827ab3ce0bed2ac22762c5d786 ;;
            "Linux ARM64") arch=arm64 sum=7f322df34e624d14f5ec0c4acb121fd6dfa14392fdbbd1066aa8e0a05ac3721e ;;
            *)
              echo "::error::The GitHub CLI (gh) is not on this runner and cannot be installed on $RUNNER_OS $RUNNER_ARCH: install gh on the runner (https://cli.github.com)"
              exit 1
              ;;
          esac
          missing=""
          for tool in curl tar; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::The GitHub CLI (gh) is not on this runner, and installing it needs:$missing"
            exit 1
          fi
          name="gh_${version}_linux_$arch"
          url="https://github.com/cli/cli/releases/download/v$version/$name.tar.gz"
          dir="$RUNNER_TEMP/gh-$version"
          archive="$dir/$name.tar.gz"
          rm -rf "$dir"
          mkdir -p "$dir"
          if ! curl -fsSL --retry 3 -o "$archive" "$url"; then
            echo "::error::Downloading the GitHub CLI failed: $url"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            actual="$(sha256sum "$archive" | cut -d " " -f 1)"
          else
            actual="$(shasum -a 256 "$archive" | cut -d " " -f 1)"
          fi
          if [ "$actual" != "$sum" ]; then
            echo "::error::The GitHub CLI archive $name.tar.gz does not match its pinned SHA-256 ($actual, expected $sum)"
            rm -rf "$dir"
            exit 1
          fi
          tar -xzf "$archive" -C "$dir"
          rm -f "$archive"
          "$dir/$name/bin/gh" --version
          echo "$dir/$name/bin" >> "$GITHUB_PATH"

      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          BODY: ${{ inputs.body }}
          KEEP_REPORT: ${{ inputs.keep-report }}
        run: |
          failed=0
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.@/-]{0,254}$ ]] || [[ "$TAG" == *..* ]]; then
            echo "::error::Input tag is not valid: \"$TAG\" (a tag name)"
            failed=1
          fi
          if [[ -z "${BODY//[[:space:]]/}" ]]; then
            echo "::error::Input body is empty; a release body is replaced with text, never cleared"
            failed=1
          fi
          if [[ "$KEEP_REPORT" == "true" && "$BODY" == *"<!-- softure-deploy:"* ]]; then
            echo "::error::Input body carries a softure-deploy section; with keep-report the sections come from the current release, pass only the text above them"
            failed=1
          fi
          exit "$failed"

      - name: Replace the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BODY: ${{ inputs.body }}
          KEEP_REPORT: ${{ inputs.keep-report }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          marker="<!-- softure-deploy:"
          kept=""
          if [[ "${KEEP_REPORT:-}" == "true" ]]; then
            current_file="$RUNNER_TEMP/release-current.md"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --template '{{.body}}' > "$current_file"
            current=""
            IFS= read -r -d '' current < "$current_file" || true
            if [[ "$current" == *"$marker"* ]]; then
              kept="$marker${current#*"$marker"}"
            fi
          fi
          if [[ -n "$kept" ]]; then
            trimmed="${BODY%"${BODY##*[![:space:]]}"}"
            printf '%s\n\n%s' "$trimmed" "$kept" > "$notes"
          else
            printf '%s' "$BODY" > "$notes"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          if [[ -n "$kept" ]]; then
            echo "The body of release **$TAG** was replaced above the report; its softure-deploy sections were kept." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${KEEP_REPORT:-}" == "true" ]]; then
            echo "The body of release **$TAG** was replaced; it had no softure-deploy section to keep." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The body of release **$TAG** was replaced." >> "$GITHUB_STEP_SUMMARY"
          fi
