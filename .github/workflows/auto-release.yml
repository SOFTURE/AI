# Releases packages from one "Run workflow" on master: creates the missing `<package>@<version>` tags
# (versions from package.json on master) and starts `release.yml` on each tag.
#
# Why: a cloud agent session cannot push a tag (its git proxy lets only the session branch through,
# HTTP 403) and the GitHub tools cannot create tags, but they can start a `workflow_dispatch`. A tag
# created with GITHUB_TOKEN starts no other workflow (GitHub's rule against recursive runs), so the
# last step starts `release.yml` explicitly; on a tag ref it takes the same path as a pushed tag.
#
# When it may run (owner, 2026-10-05): on the owner's explicit word. Each version is live on npm as
# soon as its release passes (owner, 2026-10-06). Runbook: scripts/release/README.md ("Release from Actions").

name: auto-release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package short names (e.g. "core auth"), or "all" for every public package'
        type: string
        required: true
        default: all

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tags
      actions: write # gh workflow run release.yml
    steps:
      - name: Master only
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]] \
            || { echo "::error::auto-release runs from master only, not from $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The input reaches the shell only through env; the planner refuses unknown and private names.
      - name: Plan the tags
        env:
          PACKAGES: ${{ inputs.packages }}
        run: node scripts/release/plan-tags.mjs "$PACKAGES" > release-tags.txt
      - name: Create the missing tags and start their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse HEAD)"
          echo "Release from \`${sha:0:8}\`:" >> "$GITHUB_STEP_SUMMARY"
          while read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "- $tag: tag exists, skipped (re-run it with Run workflow on the tag)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git tag -a "$tag" -m "$tag" "$sha"
            git push origin "refs/tags/$tag"
            gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
            echo "- $tag: tagged, release started" >> "$GITHUB_STEP_SUMMARY"
          done < release-tags.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[release runs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml)" >> "$GITHUB_STEP_SUMMARY"
