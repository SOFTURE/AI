# End-to-end tests of examples/next-app: the foundation packages built, packed and installed into a
# Next.js app, migrated on Postgres, and driven by Playwright. Locally: `npm run e2e`.
# The steps mirror examples/next-app/scripts/e2e.mjs, split so a failure names its stage.

name: e2e

# Triggers as in ci.yml (pull requests, master, on demand), and a documents-only change skips the run: the
# example app never reads docs/, context/ or README files. Markdown the app does read (its blog content under
# examples/) is not ignored. Each job runs only when the change reaches the example app or the deploy CLI (the
# `changes` job, scripts/ci/affected.mjs).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "context/**"
      - "*.md"
      - "**/README.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "context/**"
      - "*.md"
      - "**/README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which slow areas the change reaches (scripts/ci/affected.mjs): the jobs below that need it run only for their
  # area. A shared root file, a manual run or a failure to list the files runs every area.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      example-app: ${{ steps.areas.outputs.example-app }}
      deploy: ${{ steps.areas.outputs.deploy }}
      backup: ${{ steps.areas.outputs.backup }}
    steps:
      - uses: actions/checkout@v7
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/affected.mjs

  e2e:
    name: example app e2e
    needs: changes
    if: needs.changes.outputs.example-app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: softure_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d softure_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/softure_example
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/next-app/package-lock.json
      - run: npm ci
      # The app installs the packed packages, which ship dist/.
      - run: npm run build
      - name: Install the example app (packed foundation packages)
        working-directory: examples/next-app
        run: npm ci
      # Cached browser; apt may meet a slow mirror, hence the long timeout (#820).
      - name: Install Chromium
        timeout-minutes: 15
        uses: ./.github/actions/playwright-chromium
        with:
          working-directory: examples/next-app
      # The root ESLint config lints the example once it is installed.
      - run: npx eslint examples --max-warnings 0
      - name: Migrate (softure migrate)
        working-directory: examples/next-app
        run: npm run migrate
      - name: Publish the blog's fixture texts (softure-blog publish)
        working-directory: examples/next-app
        run: npm run blog:fixtures
      - name: Build the app
        working-directory: examples/next-app
        run: npm run build
      - name: Playwright
        working-directory: examples/next-app
        run: npm run e2e
      - name: Keep traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: examples/next-app/test-results/
          retention-days: 7

  container:
    name: example app container (ops recipe)
    needs: changes
    if: needs.changes.outputs.example-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Builds the image from the repository root, migrates as the migrator role, serves as the app
      # role, and checks GET /api/health: 200, then 503 with Postgres stopped (modules/ops/README.md).
      - run: npm run e2e:container

  deploy-init:
    name: deploy init image (softure-deploy init)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Stages the example app as a standalone app (workspace packages packed into vendor/), runs the built
      # `softure-deploy init` there, validates the generated compose file and deploy.sh (shellcheck comes with the
      # runner image), and builds the generated Dockerfile (tools/deploy/scripts/init-image.mjs).
      - run: npm run e2e:deploy-init

  # The off-site backup end to end (modules/backup/tests/offsite-store.test.ts): pg_dump 17 → age → upload with a
  # write-only identity of a real S3 gateway (SeaweedFS, scripts/ci/backup-s3.sh) → backup.runs → restore and verify
  # (schema guard, row counts) with a read-only identity. The PostgreSQL 17 tools run from the service's image, so the
  # dump format matches the server.
  backup-integration:
    name: backup integration (Postgres 17, S3)
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_IT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BACKUP_IT_S3_ENDPOINT: http://127.0.0.1:8333
      BACKUP_IT_S3_BUCKET: softure-backups
      BACKUP_IT_S3_REGION: us-east-1
      # Throwaway credentials of a container that lives as long as this job.
      BACKUP_IT_WRITER_ID: backup-writer
      BACKUP_IT_WRITER_SECRET: backup-writer-secret-1
      BACKUP_IT_READER_ID: backup-reader
      BACKUP_IT_READER_SECRET: backup-reader-secret-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start an S3 gateway with a write-only and a read-only identity
        run: bash scripts/ci/backup-s3.sh
      # pg_dump writes its file under /tmp (the test's folder), hence the mount and the runner's own user.
      - name: PostgreSQL 17 tools from the service image
        run: |
          bin="$RUNNER_TEMP/pg17"
          mkdir -p "$bin"
          for tool in pg_dump pg_restore; do
            {
              echo '#!/usr/bin/env bash'
              echo 'exec docker run --rm -i --network host --user "$(id -u):$(id -g)" --volume /tmp:/tmp \'
              echo "  -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:17 $tool \"\$@\""
            } > "$bin/$tool"
            chmod +x "$bin/$tool"
          done
          {
            echo "BACKUP_IT_PG_DUMP=$bin/pg_dump"
            echo "BACKUP_IT_PG_RESTORE=$bin/pg_restore"
          } >> "$GITHUB_ENV"
      - run: npx vitest run modules/backup/tests/offsite-store.test.ts
