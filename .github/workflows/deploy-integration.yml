# The remote integration run of the SOFTURE skills (@softure-ai/deploy, issue #248): a reusable workflow the app's
# caller (tools/deploy/examples/integration.yml) runs on a push of `integration/<name>` and of its main branch.
#
# `softure-deploy integration run` (the skills' `integration.remote`) pushes the commit to `integration/<name>`; this
# workflow runs the app's full suite on that commit, stores the result as a git note on it under
# `refs/notes/integration` (`softure-deploy integration record`) and deletes the ref. The waiting command reads the
# note; `softure-deploy integration lookup` (`integration.lookup`) reuses a green one for the same commit. On the main
# branch the note is the baseline `new-red` compares with, and no ref is deleted.
#
# The suite runs in the `test` job, which may only read the repository and keeps no credentials: the app's code never
# holds a token that can write. It may also read packages (issue #462): a `registry-token` set from the caller's
# GITHUB_TOKEN carries this job's scopes, and GHCR answers a pull of a private image without `packages: read` with
# "manifest unknown". A called job can only narrow the caller's token, so the caller grants `packages: read` too. The `record` job runs nothing of the app's, only the pinned CLI and git, and is the
# one job with `contents: write` (the notes and the ref).
#
# A release workflow can run the suite against the image it is about to deploy (issue #308): `image` names it by digest,
# the test job pulls it before the app's code runs (with the optional `registry-token` secret, through a Docker config
# deleted in the same step) and the set-up and suite commands see it as `INTEGRATION_IMAGE`, next to
# `INTEGRATION_EXPECTED_ORIGINS` and `INTEGRATION_FAIL_ON_FLAKY`. A tag push is accepted then. With `fail-on-flaky`, a
# report naming a test that passed only on a retry is stored red and fails the run.
#
# Issue #368: `artifact-paths` keeps the suite's own debugging files (Playwright traces, screenshots) when the suite is
# red or the job fails; `sparse-checkout` leaves folders the suite never reads out of both checkouts; `node-cache`
# caches the package manager's downloads between runs (npm by default).

name: deploy-integration

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner of every job as JSON, one label or an array of labels (e.g. "ubuntu-latest" or ["self-hosted","linux"])
        type: string
        default: '"ubuntu-latest"'
      test-command:
        description: The app's full suite, run with bash from the repository root; exit 0 is green, anything else red
        type: string
        required: true
      setup-command:
        description: Runs before the suite (install, build, start services); empty for none
        type: string
        default: npm ci
      junit-report:
        description: Path of the JUnit XML report the suite writes (the older form of results-report); empty for none
        type: string
        default: ""
      results-report:
        description: Path of the report the suite writes, for the counts and the red and flaky test names; empty for none
        type: string
        default: ""
      results-format:
        description: Format of results-report, junit or playwright-json; empty to tell by the extension (.json is Playwright)
        type: string
        default: ""
      image:
        description: A prebuilt image to test, <registry/name>@sha256:<64 hex>, pulled before the set-up; empty for none
        type: string
        default: ""
      expected-origins:
        description: Origins the image expects to be served at (http(s)://host[:port], comma or space separated), as INTEGRATION_EXPECTED_ORIGINS
        type: string
        default: ""
      fail-on-flaky:
        description: Store red and fail when the report names a test that passed only on a retry
        type: boolean
        default: false
      artifact-paths:
        description: Paths or globs inside the repository (one per line, ! to exclude) uploaded as integration-failure (kept 7 days) when the suite is red or the job fails; empty for none
        type: string
        default: ""
      sparse-checkout:
        description: Patterns for a sparse checkout (one per line, gitignore style with cone mode off, e.g. /* and !/docs/screenshots/); empty for the whole tree
        type: string
        default: ""
      node-cache:
        description: Package manager whose downloads setup-node caches (npm or yarn; needs its lockfile); empty for no cache
        type: string
        default: npm
      notes-ref:
        description: The notes ref the results are stored under
        type: string
        default: refs/notes/integration
      ref-prefix:
        description: The branch prefix of integration runs (the ref deleted after a run, and the start of the run's name)
        type: string
        default: integration/
      node-version:
        description: Node.js version for the suite and the deploy CLI
        type: string
        default: "22"
      deploy-cli-version:
        description: Version of @softure-ai/deploy that records the result
        type: string
        default: 0.4.6
    secrets:
      registry-token:
        description: A token that may pull `image` (e.g. the caller's GITHUB_TOKEN with packages read); none for a public image
        required: false

permissions:
  contents: read

jobs:
  test:
    name: run the suite
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # A number, not an input: the repository guards require one on every job. Two hours fit a full end-to-end suite.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      result: ${{ steps.suite.outputs.result }}
    steps:
      - &check-runner
        name: Check the runner
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # GitHub picked this runner from the value already, so a value that is not JSON never gets here; this step
        # refuses the JSON that GitHub takes but the input does not mean (an object, an empty array, a number).
        run: |
          label='"[^"\\]+"'
          space='[[:space:]]*'
          pattern="^$space($label|\\[$space$label($space,$space$label)*$space\\])$space\$"
          if [[ ! "$RUNS_ON" =~ $pattern ]]; then
            echo "::error::Input runs-on is not valid: a JSON label such as '\"ubuntu-latest\"' or a non-empty array of labels such as '[\"self-hosted\",\"linux\"]'"
            exit 1
          fi
      # A self-hosted runner keeps one work directory per repository between jobs, and a sparse checkout an earlier job
      # left there outlives the next full one (issue #687): every job that checks out starts from an empty workspace,
      # as on a hosted runner.
      - &empty-workspace
        name: Empty the workspace
        # Outside the workspace, and before a job's defaults.run.working-directory (inside the checkout) exists.
        working-directory: ${{ runner.temp }}
        run: |
          if ! find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
            echo "::error::The workspace $GITHUB_WORKSPACE could not be emptied: files of another user (a container's volume) are left there. Remove them on the runner, and empty the workspace in its job-started hook (@softure-ai/deploy README, \"Runner\")."
            exit 1
          fi

      - name: Validate inputs
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          JUNIT_REPORT: ${{ inputs.junit-report }}
          RESULTS_REPORT: ${{ inputs.results-report }}
          RESULTS_FORMAT: ${{ inputs.results-format }}
          IMAGE: ${{ inputs.image }}
          EXPECTED_ORIGINS: ${{ inputs.expected-origins }}
          NOTES_REF: ${{ inputs.notes-ref }}
          REF_PREFIX: ${{ inputs.ref-prefix }}
          NODE_VERSION: ${{ inputs.node-version }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          ARTIFACT_PATHS: ${{ inputs.artifact-paths }}
          NODE_CACHE: ${{ inputs.node-cache }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          is_repository_path() {
            [[ "$1" != /* ]] && [[ "$1" != *..* ]] && [[ "$1" =~ ^[A-Za-z0-9_./-]+$ ]]
          }
          if [ -z "$TEST_COMMAND" ]; then reject test-command "a command"; fi
          if [ -n "$JUNIT_REPORT" ] && ! is_repository_path "$JUNIT_REPORT"; then reject junit-report "a path inside the repository"; fi
          if [ -n "$RESULTS_REPORT" ] && ! is_repository_path "$RESULTS_REPORT"; then reject results-report "a path inside the repository"; fi
          if [ -n "$JUNIT_REPORT" ] && [ -n "$RESULTS_REPORT" ]; then reject results-report "empty when junit-report is set (one report)"; fi
          case "$RESULTS_FORMAT" in
            "" | junit | playwright-json) ;;
            *) reject results-format "junit, playwright-json or empty" ;;
          esac
          if [ -n "$RESULTS_FORMAT" ] && [ -z "$RESULTS_REPORT" ]; then reject results-format "empty without results-report"; fi
          if [ -n "$IMAGE" ] && [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*@sha256:[0-9a-f]{64}$ ]]; then
            reject image "<registry/name>@sha256:<64 hex digits>"
          fi
          for origin in $(printf '%s' "$EXPECTED_ORIGINS" | tr ',' ' '); do
            if [[ ! "$origin" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then reject expected-origins "http(s)://host[:port] items, got $origin"; fi
          done
          if [[ ! "$NOTES_REF" =~ ^refs/notes/[A-Za-z0-9_./-]+$ ]] || [[ "$NOTES_REF" == *..* ]]; then reject notes-ref "a ref under refs/notes/"; fi
          if [[ ! "$REF_PREFIX" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_.-]+)*/$ ]] || [[ "$REF_PREFIX" == *..* ]]; then
            reject ref-prefix "a branch prefix ending in / (e.g. integration/)"
          fi
          if [[ ! "$NODE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then reject node-version "a version number"; fi
          if [[ ! "$DEPLOY_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then reject deploy-cli-version "an exact version"; fi
          while IFS= read -r line || [ -n "$line" ]; do
            # The glob characters * and ? are read as plain ones; the rest must pass as a repository path.
            pattern="${line#!}"
            if [ -n "$line" ] && ! is_repository_path "${pattern//[*?]/x}"; then reject artifact-paths "paths or globs inside the repository, got $line"; fi
          done <<< "$ARTIFACT_PATHS"
          case "$NODE_CACHE" in
            "" | npm | yarn) ;;
            *) reject node-cache "npm, yarn or empty" ;;
          esac
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ -n "$IMAGE" ]; then
            : # A release run of a prebuilt image.
          elif [[ "$GITHUB_REF" != refs/heads/* ]]; then
            reject ref "a branch push (integration/<name> or the main branch), or a tag with image"
          fi
          if (( failures > 0 )); then exit 1; fi
      - name: Pull the image
        if: inputs.image != ''
        env:
          IMAGE: ${{ inputs.image }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # A Docker config of this step only: the token never reaches the steps that run the app's code.
          config="$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")"
          trap 'rm -rf "$config"' EXIT
          registry="${IMAGE%%/*}"
          case "$registry" in
            *.* | *:*) ;;
            *) registry=docker.io ;;
          esac
          if [ -n "$REGISTRY_TOKEN" ]; then
            printf '%s' "$REGISTRY_TOKEN" | docker --config "$config" login "$registry" --username "$REGISTRY_USER" --password-stdin
          fi
          docker --config "$config" pull "$IMAGE"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}
      - name: Set up
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
          INTEGRATION_IMAGE: ${{ inputs.image }}
          INTEGRATION_EXPECTED_ORIGINS: ${{ inputs.expected-origins }}
          INTEGRATION_FAIL_ON_FLAKY: ${{ inputs.fail-on-flaky }}
        run: bash -c "$SETUP_COMMAND"
      - id: suite
        name: Run the suite
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          INTEGRATION_IMAGE: ${{ inputs.image }}
          INTEGRATION_EXPECTED_ORIGINS: ${{ inputs.expected-origins }}
          INTEGRATION_FAIL_ON_FLAKY: ${{ inputs.fail-on-flaky }}
        run: |
          set +e
          bash -c "$TEST_COMMAND"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then result=green; else result=red; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "The suite exited $code: $result."
      - name: Keep the report
        if: always() && (inputs.results-report != '' || inputs.junit-report != '')
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: ${{ inputs.results-report || inputs.junit-report }}
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Keep the failure artifacts
        # A red suite does not fail its own step, so its result is checked as well as failure().
        if: inputs.artifact-paths != '' && (failure() || steps.suite.outputs.result == 'red')
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure
          path: ${{ inputs.artifact-paths }}
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Fail on a red suite
        if: steps.suite.outputs.result == 'red'
        run: |
          echo "::error::The suite is red; the result is stored as the commit's integration note."
          exit 1

  record:
    name: store the result note
    needs: test
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write
    # Notes pushed by two runs at once are merged by the CLI (fetch, write, push again); one record per ref at a time
    # keeps a re-run from racing its own earlier attempt.
    concurrency:
      group: deploy-integration-record-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *check-runner
      - *empty-workspace
      - uses: actions/checkout@v7
        if: needs.test.result != 'cancelled'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        if: needs.test.result != 'cancelled' && (inputs.results-report != '' || inputs.junit-report != '')
        continue-on-error: true
        with:
          name: integration-results
          path: ${{ runner.temp }}/integration-results
      - uses: actions/setup-node@v7
        if: needs.test.result != 'cancelled'
        with:
          node-version: ${{ inputs.node-version }}
      - name: Record the result
        # A cancelled suite has no result: nothing is stored, and the waiting command times out (exit 75).
        if: needs.test.result != 'cancelled'
        env:
          # Empty when the suite job failed before the suite ran (checkout, setup): that is red too.
          RESULT: ${{ needs.test.outputs.result || 'red' }}
          JUNIT_REPORT: ${{ inputs.junit-report }}
          RESULTS_REPORT: ${{ inputs.results-report }}
          RESULTS_FORMAT: ${{ inputs.results-format }}
          FAIL_ON_FLAKY: ${{ inputs.fail-on-flaky }}
          NOTES_REF: ${{ inputs.notes-ref }}
          REF_PREFIX: ${{ inputs.ref-prefix }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          args=(integration record "--sha=$GITHUB_SHA" "--ref=$GITHUB_REF" "--result=$RESULT" "--run=$RUN_URL")
          # Flags beyond the defaults only, so a caller pinning an older CLI keeps working.
          if [ -n "$JUNIT_REPORT" ]; then
            args+=("--junit=$RUNNER_TEMP/integration-results/$(basename "$JUNIT_REPORT")")
          fi
          if [ -n "$RESULTS_REPORT" ]; then
            args+=("--results=$RUNNER_TEMP/integration-results/$(basename "$RESULTS_REPORT")")
            if [ -n "$RESULTS_FORMAT" ]; then args+=("--format=$RESULTS_FORMAT"); fi
          fi
          if [ "$FAIL_ON_FLAKY" = "true" ]; then args+=(--fail-on-flaky); fi
          if [ "$NOTES_REF" != "refs/notes/integration" ]; then args+=("--notes-ref=$NOTES_REF"); fi
          if [ "$REF_PREFIX" != "integration/" ]; then args+=("--ref-prefix=$REF_PREFIX"); fi
          npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy "${args[@]}"
      - name: Delete the integration ref
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PREFIX: ${{ inputs.ref-prefix }}
        run: |
          case "$GITHUB_REF" in
            "refs/heads/$REF_PREFIX"*)
              # The API, not git: the checkout above is skipped when the suite was cancelled.
              if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/${GITHUB_REF#refs/}" 2> "$RUNNER_TEMP/gh-error"; then
                # Already gone (a re-run, or the author deleted it) is fine; anything else is not.
                grep -q "Reference does not exist" "$RUNNER_TEMP/gh-error" || { cat "$RUNNER_TEMP/gh-error" >&2; exit 1; }
              fi
              echo "Deleted $GITHUB_REF."
              ;;
            *)
              echo "$GITHUB_REF is not an integration ref; it stays."
              ;;
          esac
