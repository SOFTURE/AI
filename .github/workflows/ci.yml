# The gates of lefthook.yml, on GitHub, for every push and pull request.
# Tags are not built here: releases have their own workflow.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint + language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `prepare` skips the hook install because GitHub sets CI.
      - run: npm ci
      - run: npm run typecheck
      # ESLint over the whole tree, then the language gate over every tracked file.
      - run: npm run lint

  test:
    name: unit and repository tests
    runs-on: ubuntu-latest
    # @softure-ai/db runs its migrator tests on PGlite and on a real Postgres; without this
    # server its Postgres cases would fail (foundation/db/tests/postgres-env.test.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOFTURE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A Stripe test-mode key runs billing's sandbox test (modules/billing/tests/stripe-sandbox.test.ts);
      # without the secret (forks, a repository that has not set it) that test is skipped.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
