# The gates of lefthook.yml, on GitHub, for every pull request and every push to master, plus the
# marketing-kit fixture film rendered end to end (too slow and too browser-bound for a hook) and actionlint
# over the workflows. Tags are not built here: releases have their own workflow.
#
# Not on every pushed branch: a branch with a pull request would run everything twice (the push and the
# pull request have different refs, so `concurrency` cannot fold them), and the hooks already run these
# gates before each commit and push. A branch without a pull request runs them on demand (workflow_dispatch).
# No paths filter: the repository tests guard the Markdown too (links, roadmap contract, language gate).

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or per branch), the newest wins.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint + language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `prepare` skips the hook install because GitHub sets CI.
      - run: npm ci
      - run: npm run typecheck
      # ESLint over the whole tree, then the language gate over every tracked file.
      - run: npm run lint

  test:
    name: unit and repository tests
    runs-on: ubuntu-latest
    # @softure-ai/db runs its migrator tests on PGlite and on a real Postgres; without this
    # server its Postgres cases would fail (foundation/db/tests/postgres-env.test.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOFTURE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A Stripe test-mode key runs billing's sandbox test (modules/billing/tests/stripe-sandbox.test.ts);
      # without the secret (forks, a repository that has not set it) that test is skipped.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # The marketing-kit screenshot tests drive a browser; the runner image ships Google Chrome, so no
      # download (tools/marketing-kit/tests/chromium.ts fails them if this path is missing).
      PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  render:
    name: marketing-kit fixture film render
    runs-on: ubuntu-latest
    # The test allows 10 minutes; a hung download must not hold a runner for hours.
    timeout-minutes: 15
    env:
      # The recorder drives the runner's Chrome, as the screenshot tests in `test` do.
      PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome
      HYPERFRAMES_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The fixture's voiceover and sound effects are tones generated with ffmpeg; the test probes the MP4 with ffprobe.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      # hyperframes would settle for the runner's Chrome and fall back to its slower screenshot capture; `--force`
      # downloads the chrome-headless-shell it pins, so CI renders the way a real film does.
      - name: Install hyperframes' Chrome
        timeout-minutes: 5
        run: |
          # After a download, `browser ensure` prints "Ready to render." but never exits (hyperframes 0.8.85, seen
          # on the runner), so it runs as a job in its own process group (`set -m`), stopped once that line appears.
          set -m
          log="$RUNNER_TEMP/hyperframes-ensure.log"
          npx hyperframes browser ensure --force > "$log" 2>&1 &
          ensure=$!
          until grep -q "Ready to render" "$log"; do
            if ! kill -0 "$ensure" 2>/dev/null; then
              grep -q "Ready to render" "$log" && break
              cat "$log"; exit 1
            fi
            sleep 1
          done
          kill -- "-$ensure" 2>/dev/null || true
          cat "$log"
          browser="$(npx hyperframes browser path)"
          case "$browser" in
            "$HOME/.cache/hyperframes/"*) echo "HYPERFRAMES_BROWSER_PATH=$browser" >> "$GITHUB_ENV" ;;
            *) echo "hyperframes resolved $browser, not its own headless shell" >&2; exit 1 ;;
          esac
      - name: Render the fixture film
        run: npx vitest run tools/marketing-kit/tests/render.test.ts --reporter=verbose
        env:
          MARKETING_KIT_RENDER: "1"

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      # A pinned release checked against its published SHA-256; shellcheck comes with the runner image, so the
      # `run:` scripts are checked too. The example callers of the deploy workflows live outside .github/workflows/.
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: |
          shellcheck --version | head -n 2
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/actionlint" -color tools/deploy/examples/deploy.yml tools/deploy/examples/release.yml

  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
