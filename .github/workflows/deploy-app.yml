# Release of one app to its VPS (@softure-ai/deploy, DP-2): a reusable workflow an app calls with one `uses:` line.
# It builds the image from the release tag and pushes it to GHCR, renders `.env.prod` from the app's secrets with
# `softure-deploy env render`, hands it to the server's forced SSH command, and waits for the health route.
#
# The caller is `tools/deploy/examples/deploy.yml` in this repository: copy it to the app's `.github/workflows/`.
# It grants `contents: read` and `packages: write`; the jobs below take only what each one needs.
#
# The server side (generated by `softure-deploy init`, DP-5): the deploy key is bound to a forced command in
# `authorized_keys`, which receives `SSH_ORIGINAL_COMMAND="<remote-command> <tag>"` and the rendered `.env.prod` on
# stdin, pulls `<image>:<tag>` and restarts the stack. The host key is checked against `ssh-known-hosts`, never
# learned on first use.
#
# Every input is validated by the `check` job before anything is built or sent, and every value reaches a script
# through `env:`, never interpolated into it. The CLI comes from npm (`deploy-cli-version`), so the workflow runs once
# @softure-ai/deploy is published (DP-8).

name: deploy-app

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy (a git tag of the app; also the image tag)
        type: string
        required: true
      app-url:
        description: The app's public base URL, e.g. https://example.com (the verify target)
        type: string
        required: true
      image:
        description: Image name without a tag; empty means ghcr.io/<owner>/<repository> of the caller, lower-cased
        type: string
        default: ""
      context:
        description: Docker build context in the app's repository
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path in the app's repository
        type: string
        default: Dockerfile
      compose-file:
        description: Production compose file whose required variables (${NAME:?}) name the secrets to render
        type: string
        default: docker/prod/docker-compose.yml
      environment:
        description: GitHub environment of the deploy job (protection rules, environment secrets); empty for none
        type: string
        default: ""
      remote-command:
        description: First word sent to the server's forced command, followed by the tag
        type: string
        default: deploy
      ssh-port:
        description: SSH port of the server
        type: number
        default: 22
      health-path:
        description: Route that answers 200 once the new release is up
        type: string
        default: /api/health
      verify-timeout-seconds:
        description: How long verify waits for the health route to answer 200
        type: number
        default: 300
      deploy-cli-version:
        description: Version of @softure-ai/deploy that renders .env.prod
        type: string
        default: 0.1.0
      node-version:
        description: Node.js version that runs the deploy CLI
        type: string
        default: "22"
    secrets:
      ssh-host:
        description: Server host name or IP address
        required: true
      ssh-user:
        description: User whose authorized_keys binds the deploy key to the forced command
        required: true
      ssh-private-key:
        description: Private deploy key (OpenSSH format)
        required: true
      ssh-known-hosts:
        description: known_hosts line(s) of the server, e.g. from `ssh-keyscan` run once by the owner and checked
        required: true
      app-secrets:
        description: JSON object of the app's runtime secrets by name, e.g. toJSON(secrets)
        required: true
    outputs:
      image:
        description: The pushed image reference with its tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  check:
    name: check inputs
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.inputs.outputs.image }}
    steps:
      - id: inputs
        name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          APP_URL: ${{ inputs.app-url }}
          IMAGE: ${{ inputs.image }}
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          REMOTE_COMMAND: ${{ inputs.remote-command }}
          SSH_PORT: ${{ inputs.ssh-port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          expect() {
            if [[ ! "$2" =~ $3 ]]; then reject "$1" "$4"; fi
          }
          expect_path() {
            expect "$1" "$2" '^[A-Za-z0-9_.][A-Za-z0-9_./-]*$' "a relative path"
            if [[ "/$2/" == */../* ]]; then reject "$1" "a path without .. segments"; fi
          }
          expect tag "$TAG" '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' "a Docker tag (letters, digits, _ . -; at most 128)"
          expect app-url "$APP_URL" '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$' "https://<host>[:port] with no path"
          expect_path context "$BUILD_CONTEXT"
          expect_path dockerfile "$DOCKERFILE"
          expect_path compose-file "$COMPOSE_FILE"
          expect environment "$DEPLOY_ENVIRONMENT" '^[A-Za-z0-9_. -]{0,255}$' "letters, digits, space, _ . -"
          expect remote-command "$REMOTE_COMMAND" '^[a-z][a-z0-9-]{0,31}$' "one lower-case word"
          if [[ ! "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( SSH_PORT > 65535 )); then reject ssh-port "1 to 65535"; fi
          expect health-path "$HEALTH_PATH" '^/[A-Za-z0-9/._~-]*$' "a path starting with /"
          expect verify-timeout-seconds "$VERIFY_TIMEOUT" '^[1-9][0-9]{1,3}$' "10 to 9999 seconds"
          expect deploy-cli-version "$DEPLOY_CLI_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' "an exact version"
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/${REPOSITORY,,}"; fi
          expect image "$IMAGE" '^[a-z0-9.-]+(:[0-9]{1,5})?(/[a-z0-9]+([._-][a-z0-9]+)*)+$' "registry/name, lower case, no tag"
          if (( failures > 0 )); then exit 1; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build:
    name: build and push the image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Image reference
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy over SSH
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    # One deploy at a time per app and environment; a running deploy is never cancelled halfway.
    concurrency:
      group: deploy-app-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: ${{ inputs.compose-file }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      # The app's secrets go to the CLI's environment only; it writes the compose file's required names to
      # .env.prod (mode 0600) and prints names, never values. Names that steer Node or npm itself are refused.
      - name: Render .env.prod
        env:
          APP_SECRETS: ${{ secrets.app-secrets }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
        run: |
          node - <<'JS'
          const { spawnSync } = require("node:child_process");
          const RESERVED = /^(PATH|HOME|NODE_.*|NPM_CONFIG_.*)$/i;
          let secrets = null;
          try {
            secrets = JSON.parse(process.env.APP_SECRETS ?? "");
          } catch {
            // Reported below without echoing the value.
          }
          if (secrets === null || typeof secrets !== "object" || Array.isArray(secrets)) {
            console.log("::error::app-secrets is not a JSON object of names and values.");
            process.exit(1);
          }
          const env = { PATH: process.env.PATH, HOME: process.env.HOME };
          for (const [name, value] of Object.entries(secrets)) {
            if (RESERVED.test(name)) {
              console.log(`::error::app-secrets: ${name} is reserved for the runner and cannot be rendered.`);
              process.exit(1);
            }
            if (typeof value === "string") env[name] = value;
          }
          const result = spawnSync(
            "npx",
            [
              "--yes",
              `--package=@softure-ai/deploy@${process.env.DEPLOY_CLI_VERSION}`,
              "softure-deploy",
              "env",
              "render",
              `--compose=${process.env.COMPOSE_FILE}`,
              "--out=.env.prod",
            ],
            { env, stdio: "inherit" },
          );
          process.exit(result.status ?? 1);
          JS
      - name: Send the release to the server
        env:
          SSH_HOST: ${{ secrets.ssh-host }}
          SSH_USER: ${{ secrets.ssh-user }}
          SSH_PRIVATE_KEY: ${{ secrets.ssh-private-key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh-known-hosts }}
          SSH_PORT: ${{ inputs.ssh-port }}
          REMOTE_COMMAND: ${{ inputs.remote-command }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then echo "::error::ssh-host is not a host name or address."; exit 1; fi
          if [[ ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then echo "::error::ssh-user is not a user name."; exit 1; fi
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/deploy_known_hosts"
          (
            umask 077
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          )
          ssh -i "$key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND $TAG" < .env.prod
      - name: Remove the key and .env.prod
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts" .env.prod

  verify:
    name: verify the health route
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Wait for the health route
        env:
          APP_URL: ${{ inputs.app-url }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
        run: |
          url="${APP_URL%/}$HEALTH_PATH"
          deadline=$((SECONDS + VERIFY_TIMEOUT))
          while true; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$status" = "200" ]; then
              echo "verify: $url answered 200."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::verify: $url did not answer 200 within ${VERIFY_TIMEOUT}s (last: ${status:-no answer})."
              exit 1
            fi
            echo "verify: $url answered ${status:-nothing}; retrying in 10s."
            sleep 10
          done
