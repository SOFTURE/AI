# Release of one app to its VPS (@softure-ai/deploy, DP-2): a reusable workflow an app calls with one `uses:` line.
# It builds the image from the release tag and pushes it to GHCR, renders `.env.prod` from the app's secrets with
# `softure-deploy env render`, hands it to the server's forced SSH command, and verifies the release.
#
# An app that tests its image before the release passes it as `prebuilt-image` (`<image>@sha256:<digest>`, from the
# same repository): nothing is built, the release tag is added to exactly that image, and the server pulls it by tag,
# so production runs the bytes the tests saw.
#
# The caller is `tools/deploy/examples/deploy.yml` in this repository: copy it to the app's `.github/workflows/`.
# It grants `contents: read` and `packages: write`; the jobs below take only what each one needs.
#
# The server side (generated by `softure-deploy init`, DP-5): the deploy key is bound to a forced command in
# `authorized_keys`, which receives `SSH_ORIGINAL_COMMAND="<remote-command> <tag>"` and the release archive on stdin
# (DF-7): a gzip tar of the compose file's folder (`docker/prod/`), the `server-script`, the app's `deploy-config` (as
# `deploy.json`), the rendered `.env.prod` and the registry token (`.registry-token`, DF-11). It installs the files
# next to itself (never the token), pulls `<image>:<tag>` and restarts the stack, so a changed compose file, Traefik
# rule or server script ships with the release that needs it. The release counts only when the server's output holds
# the line `result|ok` (init's deploy.sh prints it, DF-9).
# The host key is checked against `ssh-known-hosts`, never learned on first use.
#
# Verify waits for the health route, then runs `softure-deploy verify <app-url>` (DP-4) with the app's `deploy.json`
# from the tag: every route, status, marker, redirect and header the app lists. `deploy-config: ""` keeps the health
# route only. With the `origin-address` secret (or the app-vars entry `origin-address-var` names), verify also fails
# when the server accepts a direct connection (DF-13): only the CDN may reach it.
#
# Release guards (DF-11): the `check` job refuses a tag whose commit is not on the release branch (the caller's default
# branch unless `release-branch` names another). `build-args` are baked into the image (public values only: they are
# readable in the image's history), and a build argument whose name `.env.prod` also holds must carry the same value
# there (an origin in the image that differs from the runtime one broke every write of an adopting app).
# `app-vars` are non-secret values (e.g. toJSON(vars)) rendered over `app-secrets`, so a switch like `1` is not masked
# in every log line. The deploy job's own GITHUB_TOKEN (packages: read, valid until the job ends) rides in the archive
# as `.registry-token`; the server pulls with it through a throwaway Docker config and keeps no registry login.
#
# Every input is validated by the `check` job before anything is built or sent, and every value reaches a script
# through `env:`, never interpolated into it. The CLI comes from npm (`deploy-cli-version`), so the workflow runs once
# @softure-ai/deploy is published (DP-8).
#
# Secrets come one of two ways. By name: the caller passes `app-secrets` and the four SSH secrets from its own context,
# which holds repository and organization secrets only (a job with `uses:` cannot name an environment). From an
# environment: `deploy: false` runs the check and the build only, and the caller's own job, which declares
# `environment:` (one per environment), runs the deploy action (.github/actions/deploy) with the `release` output, each
# secret by name in the step's `env:` (`secret-names`) and its environment's variables
# (tools/deploy/examples/deploy-environments.yml). This workflow never reads its whole secrets context nor a secret
# by a computed name (CodeQL excessive-secrets-exposure, issue #476): `secrets-from-environment`, which did, was removed
# in 0.4.0 and is refused. The origin address can come from an `app-vars` entry (`origin-address-var`).
#
# The deploy and verify jobs run that same action: each checks out this workflow's own commit (job.workflow_sha) into
# `.softure-ai-deploy/` and runs it from there, passing the values it reads from its secrets context.
#
# Variables for verify (a Web Bot Auth key a `webBotAuth` route signs with): the secret `verify-env`, a JSON object of
# text values by name. Only that one secret reaches the job, never the whole secrets context. The verify step masks
# each value and hands the variables to `softure-deploy verify` only; a name the step or the runner sets itself is
# refused.
#
# Whatever happened, the `summary` job uploads the run's facts (each job's result, the image, its digest and the
# server's step lines) as the artifact `deploy-report`; the caller's second job, deploy-report.yml (DF-10), writes them
# into the tag's GitHub Release.
#
# `e2e: true` is this repository's own end-to-end test (.github/workflows/e2e-deploy.yml, DF-3, DF-15) and is refused
# in any other repository. On that path nothing leaves the runners: the image is built without a push and handed to
# the deploy job as the artifact `deploy-e2e-image`, the CLI runs from the tag's checkout, and the deploy job's runner
# becomes the server (tools/deploy/e2e/start-server.sh): a registry holding the image, a certificate for the app's host
# from a CA of the run, and sshd whose forced command records what it received and runs the tag's deploy.sh, which
# brings the stack up on the runner. The send step's ssh command is the production one pointed at it. The verify job's
# two steps then run in the deploy job (the stack lives on its runner) with the tag's CLI; the recording is uploaded
# as the artifact `deploy-e2e-received` for the caller to check.

name: deploy-app

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy (a git tag of the app; also the image tag)
        type: string
        required: true
      app-url:
        description: The app's public base URL, e.g. https://example.com (the verify target)
        type: string
        required: true
      image:
        description: Image name without a tag; empty means ghcr.io/<owner>/<repository> of the caller, lower-cased
        type: string
        default: ""
      prebuilt-image:
        description: "An image already built and tested, by digest: <image>@sha256:<64 hex>, the repository of image. Skips the build and tags that image with the release tag; empty builds from the tag"
        type: string
        default: ""
      context:
        description: Docker build context in the app's repository
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path in the app's repository
        type: string
        default: Dockerfile
      compose-file:
        description: Production compose file whose required variables (${NAME:?}) name the secrets to render; its folder ships to the server
        type: string
        default: docker/prod/docker-compose.yml
      server-script:
        description: The server's forced command in the app's repository; each release installs it as deploy.sh
        type: string
        default: docker/server/deploy.sh
      environment:
        description: GitHub environment of the deploy job (protection rules and the report's name; the secrets come by name from the caller); empty for none
        type: string
        default: ""
      deploy:
        description: "false: check and build only, no secrets; the caller's own job, in its environment, runs the deploy action with the release output"
        type: boolean
        default: true
      secrets-from-environment:
        description: "Removed in 0.4.0 (it passed the whole secrets context to the runner): true is refused; deploy from an environment with deploy: false and the deploy action"
        type: boolean
        default: false
      origin-address-var:
        description: Name of an app-vars entry holding the origin address (instead of the origin-address secret); empty for none
        type: string
        default: ""
      remote-command:
        description: First word sent to the server's forced command, followed by the tag
        type: string
        default: deploy
      ssh-port:
        description: SSH port of the server
        type: number
        default: 22
      health-path:
        description: Route that answers 200 once the new release is up
        type: string
        default: /api/health
      verify-timeout-seconds:
        description: How long verify waits for the health route to answer 200
        type: number
        default: 300
      deploy-config:
        description: The app's deploy.json in the tag, verified and shipped to the server; empty means the health route only
        type: string
        default: deploy.json
      deploy-cli-version:
        description: Version of @softure-ai/deploy that renders .env.prod and verifies the release
        type: string
        default: 0.4.4
      node-version:
        description: Node.js version that runs the deploy CLI
        type: string
        default: "22"
      sparse-checkout:
        description: "Checkout patterns for the image build, non-cone (e.g. /* and !/context/archive/); empty = the whole tag"
        type: string
        default: ""
      release-branch:
        description: Branch the tag's commit must be on; empty means the caller's default branch
        type: string
        default: ""
      build-args:
        description: "Build arguments baked into the image, one NAME=value per line; public values only. A name .env.prod also holds must carry the same value there"
        type: string
        default: ""
      app-vars:
        description: JSON object of non-secret values by name, e.g. toJSON(vars); rendered like app-secrets and taking precedence over them
        type: string
        default: "{}"
      secret-min-lengths:
        description: "Shortest allowed length of rendered values, NAME=N separated by spaces or newlines (env render --min-length)"
        type: string
        default: ""
      registry-token:
        description: Send the deploy job's short-lived GITHUB_TOKEN with the release, so the server pulls without a registry login of its own
        type: boolean
        default: true
      e2e:
        description: SOFTURE/AI's own end-to-end test only (e2e-deploy.yml); refused in any other repository
        type: boolean
        default: false
    # Required unless deploy is false, where the caller's job passes them to the deploy action; the check job refuses a
    # missing one by name. Not `required: true`, because a caller with deploy: false passes none.
    secrets:
      ssh-host:
        description: Server host name or IP address (required unless deploy is false)
        required: false
      ssh-user:
        description: User whose authorized_keys binds the deploy key to the forced command (required unless deploy is false)
        required: false
      ssh-private-key:
        description: Private deploy key, OpenSSH format (required unless deploy is false)
        required: false
      ssh-known-hosts:
        description: known_hosts line(s) of the server, e.g. from `ssh-keyscan` run once by the owner and checked (required unless deploy is false)
        required: false
      app-secrets:
        description: JSON object of the app's runtime secrets by name (required unless deploy is false)
        required: false
      origin-address:
        description: >-
          The server's own address behind the CDN (IP or host, optional :port, default 443), e.g. vars.DEPLOY_IP;
          verify fails when it accepts a direct connection. Empty skips the check. Needs deploy-config.
        required: false
      verify-env:
        description: >-
          JSON object of variables by name exported for softure-deploy verify only, masked, e.g.
          {"WEB_BOT_AUTH_PRIVATE_KEY": "..."} for a webBotAuth route. Needs deploy-config.
        required: false
    outputs:
      release:
        description: The check job's validated values as one JSON object, the deploy action's release input
        value: ${{ jobs.check.outputs.release }}
      image:
        description: The pushed image reference with its tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  check:
    name: check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The branch guard reads the tag's history.
    permissions:
      contents: read
    outputs:
      image: ${{ steps.inputs.outputs.image }}
      server-files: ${{ steps.inputs.outputs.server-files }}
      release: ${{ steps.inputs.outputs.release }}
    steps:
      - id: inputs
        name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          APP_URL: ${{ inputs.app-url }}
          IMAGE: ${{ inputs.image }}
          PREBUILT_IMAGE: ${{ inputs.prebuilt-image }}
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVER_SCRIPT: ${{ inputs.server-script }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          REMOTE_COMMAND: ${{ inputs.remote-command }}
          SSH_PORT: ${{ inputs.ssh-port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          NODE_VERSION: ${{ inputs.node-version }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SECRET_MIN_LENGTHS: ${{ inputs.secret-min-lengths }}
          REGISTRY_TOKEN: ${{ inputs.registry-token }}
          DEPLOY: ${{ inputs.deploy }}
          E2E: ${{ inputs.e2e }}
          REPOSITORY: ${{ github.repository }}
          ORIGIN_ADDRESS: ${{ secrets.origin-address }}
          ORIGIN_ADDRESS_VAR: ${{ inputs.origin-address-var }}
          APP_VARS: ${{ inputs.app-vars }}
          SECRETS_FROM_ENVIRONMENT: ${{ inputs.secrets-from-environment }}
          VERIFY_ENV: ${{ secrets.verify-env }}
          VERIFY_ENV_RULES: >-
            if type != "object" or any(.[]; type != "string") then "a JSON object of text values by name"
            else keys_unsorted[]
              | if test("^[A-Za-z_][A-Za-z0-9_]*$") | not then "\(.) is not a name (letters, digits, _)"
                elif ascii_upcase | test("^(APP_URL|DEPLOY_CONFIG|DEPLOY_CLI_VERSION|ORIGIN_ADDRESS|ORIGIN_ADDRESS_VAR|APP_VARS|VERIFY_ENV|VERIFY_ENV_SECRET|VERIFY_ENV_RULES|PATH|HOME|NODE_.*|NPM_CONFIG_.*)$")
                then "\(.) is reserved for the verify step or the runner"
                else empty end
            end
          # The names of the named secrets the caller passed, never a value.
          PASSED_SECRETS: >-
            ${{ secrets.ssh-host != '' && 'ssh-host' || '' }}
            ${{ secrets.ssh-user != '' && 'ssh-user' || '' }}
            ${{ secrets.ssh-private-key != '' && 'ssh-private-key' || '' }}
            ${{ secrets.ssh-known-hosts != '' && 'ssh-known-hosts' || '' }}
            ${{ secrets.app-secrets != '' && 'app-secrets' || '' }}
            ${{ secrets.verify-env != '' && 'verify-env' || '' }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          expect() {
            if [[ ! "$2" =~ $3 ]]; then reject "$1" "$4"; fi
          }
          expect_path() {
            expect "$1" "$2" '^[A-Za-z0-9_.][A-Za-z0-9_./-]*$' "a relative path"
            if [[ "/$2/" == */../* ]]; then reject "$1" "a path without .. segments"; fi
          }
          expect tag "$TAG" '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' "a Docker tag (letters, digits, _ . -; at most 128)"
          expect app-url "$APP_URL" '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$' "https://<host>[:port] with no path"
          expect_path context "$BUILD_CONTEXT"
          expect_path dockerfile "$DOCKERFILE"
          expect_path compose-file "$COMPOSE_FILE"
          # The compose file's folder ships to the server; at the root it would be the whole tag.
          if [[ "$COMPOSE_FILE" != */* ]]; then reject compose-file "a file inside a folder (the folder ships to the server)"; fi
          expect_path server-script "$SERVER_SCRIPT"
          expect environment "$DEPLOY_ENVIRONMENT" '^[A-Za-z0-9_. -]{0,255}$' "letters, digits, space, _ . -"
          expect remote-command "$REMOTE_COMMAND" '^[a-z][a-z0-9-]{0,31}$' "one lower-case word"
          if [[ ! "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( SSH_PORT > 65535 )); then reject ssh-port "1 to 65535"; fi
          expect health-path "$HEALTH_PATH" '^/[A-Za-z0-9/._~-]*$' "a path starting with /"
          expect verify-timeout-seconds "$VERIFY_TIMEOUT" '^[1-9][0-9]{1,3}$' "10 to 9999 seconds"
          if [ -n "$DEPLOY_CONFIG" ]; then expect_path deploy-config "$DEPLOY_CONFIG"; fi
          # Secrets by name. With deploy: false the caller's job passes them to the deploy action, so this workflow
          # takes none. secrets-from-environment, which read the whole secrets context, is gone (0.4.0, issue #476).
          if [ "${SECRETS_FROM_ENVIRONMENT:-false}" = "true" ]; then
            reject secrets-from-environment "false (removed in 0.4.0: deploy from the environment's own job with deploy: false and the deploy action, secrets by name)"
          fi
          if [ "${DEPLOY:-true}" = "false" ]; then
            for name in ${PASSED_SECRETS:-}; do
              reject deploy "true when the secret $name is passed (the caller's job passes it to the deploy action)"
            done
            if [ -n "$ORIGIN_ADDRESS" ]; then reject deploy "true when the secret origin-address is passed (the deploy action takes it)"; fi
            if [ -n "${ORIGIN_ADDRESS_VAR:-}" ]; then reject deploy "true with origin-address-var (the deploy action takes origin-address)"; fi
            if [ "$E2E" = "true" ]; then reject deploy "true with e2e (the end-to-end test deploys)"; fi
          elif [ "${SECRETS_FROM_ENVIRONMENT:-false}" != "true" ]; then
            for name in ssh-host ssh-user ssh-private-key ssh-known-hosts app-secrets; do
              if [[ " ${PASSED_SECRETS:-} " != *" $name "* ]]; then
                echo "::error::Secret $name is required: pass it, or set deploy: false and run the deploy action from the environment's job."
                failures=$((failures + 1))
              fi
            done
          fi
          origin_input=origin-address
          # The origin address from an app-vars entry, for a caller that keeps it a variable. Not a secret, so it is
          # printed like any app-vars value.
          if [ -n "${ORIGIN_ADDRESS_VAR:-}" ]; then
            if [[ ! "$ORIGIN_ADDRESS_VAR" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              reject origin-address-var "a name (letters, digits, _)"
            elif [ -n "$ORIGIN_ADDRESS" ]; then
              reject origin-address-var "empty when the secret origin-address is passed (one source)"
            else
              ORIGIN_ADDRESS="$(printf '%s' "${APP_VARS:-}" | jq -r --arg name "$ORIGIN_ADDRESS_VAR" '.[$name] | strings' 2> /dev/null || true)"
              origin_input=origin-address-var
              if [ -z "$ORIGIN_ADDRESS" ]; then reject origin-address-var "the name of a text entry in app-vars"; fi
            fi
          fi
          if [ -n "$ORIGIN_ADDRESS" ]; then
            expect "$origin_input" "$ORIGIN_ADDRESS" '^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?$|^[0-9A-Fa-f:.]+$' "an IP address or host with an optional :port"
            # The origin is checked by the verify step, which runs only with a config: refuse a check that would not run.
            if [ -z "$DEPLOY_CONFIG" ]; then reject "$origin_input" "empty when deploy-config is empty (verify runs with deploy.json)"; fi
          fi
          # The verify step's variables: the secret verify-env is checked here, before anything is built.
          if [ -n "${VERIFY_ENV:-}" ]; then
            if [ -z "$DEPLOY_CONFIG" ]; then
              reject verify-env "empty when deploy-config is empty (verify runs with deploy.json)"
            else
              while IFS= read -r problem; do
                if [ -n "$problem" ]; then reject verify-env "$problem"; fi
              done < <(printf '%s' "$VERIFY_ENV" | jq -r "$VERIFY_ENV_RULES" 2> /dev/null || echo "a JSON object of text values by name")
            fi
          fi
          expect deploy-cli-version "$DEPLOY_CLI_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' "an exact version"
          if [ -n "${RELEASE_BRANCH:-}" ]; then
            expect release-branch "$RELEASE_BRANCH" '^[A-Za-z0-9_.][A-Za-z0-9_./-]{0,254}$' "a branch name"
            if [[ "$RELEASE_BRANCH" == *..* || "$RELEASE_BRANCH" == */ ]]; then reject release-branch "a branch name"; fi
          fi
          # One NAME=value per line, each name once: docker/build-push-action reads the same list.
          # Names seen so far, one per line between newlines: bash 3.2 (macOS, where the tests run this step) has no
          # associative arrays, and a name holds no newline.
          build_arg_names=$'\n'
          line_number=0
          while IFS= read -r line; do
            line_number=$((line_number + 1))
            if [[ "$line" =~ ^[[:space:]]*$ ]]; then continue; fi
            if [[ ! "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)= ]]; then
              reject build-args "NAME=value lines (line $line_number is not)"
              continue
            fi
            name="${BASH_REMATCH[1]}"
            if [[ "$build_arg_names" == *$'\n'"$name"$'\n'* ]]; then reject build-args "each name once ($name repeats)"; fi
            build_arg_names+="$name"$'\n'
          done <<< "${BUILD_ARGS:-}"
          # The test path builds the CLI from a full checkout of the tag; only this repository's tags are trusted so.
          if [ "$E2E" = "true" ] && [ "$REPOSITORY" != "SOFTURE/AI" ]; then
            reject e2e "false outside SOFTURE/AI (it is that repository's own end-to-end test)"
          fi
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"; fi
          expect image "$IMAGE" '^[a-z0-9.-]+(:[0-9]{1,5})?(/[a-z0-9]+([._-][a-z0-9]+)*)+$' "registry/name, lower case, no tag"
          # By digest only: a tag could move between the tests and the release. The same repository, so the re-tag
          # copies no layers and the server pulls what the image input names.
          if [ -n "${PREBUILT_IMAGE:-}" ]; then
            if [[ ! "$PREBUILT_IMAGE" =~ ^(.+)@sha256:[0-9a-f]{64}$ ]] || [ "${BASH_REMATCH[1]}" != "$IMAGE" ]; then
              reject prebuilt-image "$IMAGE@sha256:<64 hex digits> (the image input's repository, by digest)"
            fi
            if [ "$E2E" = "true" ]; then reject prebuilt-image "empty with e2e (the end-to-end test builds its own image)"; fi
          fi
          if (( failures > 0 )); then exit 1; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # Anchored non-cone patterns: the deploy job fetches only these, so no .npmrc of the app steers npx.
          prod_dir="${COMPOSE_FILE%/*}"
          server_files="/$prod_dir/"$'\n'"/$SERVER_SCRIPT"$'\n'
          if [ -n "$DEPLOY_CONFIG" ]; then server_files+="/$DEPLOY_CONFIG"$'\n'; fi
          {
            echo "server-files<<SERVER_FILES"
            printf '%s' "$server_files"
            echo "SERVER_FILES"
          } >> "$GITHUB_OUTPUT"
          # The deploy action's release input: every value it needs, validated above, as one line of JSON.
          release="$(jq -cn \
            --arg tag "$TAG" --arg app_url "$APP_URL" --arg image "$IMAGE" --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg compose_file "$COMPOSE_FILE" --arg server_script "$SERVER_SCRIPT" --arg deploy_config "$DEPLOY_CONFIG" \
            --arg remote_command "$REMOTE_COMMAND" --arg ssh_port "$SSH_PORT" --arg health_path "$HEALTH_PATH" \
            --arg verify_timeout "$VERIFY_TIMEOUT" --arg cli_version "$DEPLOY_CLI_VERSION" --arg node_version "${NODE_VERSION:-}" \
            --arg build_args "${BUILD_ARGS:-}" --arg min_lengths "${SECRET_MIN_LENGTHS:-}" --arg registry_token "${REGISTRY_TOKEN:-true}" \
            --arg server_files "$server_files" \
            '{"tag": $tag, "app-url": $app_url, "image": $image, "environment": $environment, "compose-file": $compose_file,
              "server-script": $server_script, "deploy-config": $deploy_config, "remote-command": $remote_command,
              "ssh-port": $ssh_port, "health-path": $health_path, "verify-timeout-seconds": $verify_timeout,
              "deploy-cli-version": $cli_version, "node-version": $node_version, "build-args": $build_args,
              "secret-min-lengths": $min_lengths, "registry-token": $registry_token, "server-files": $server_files}')"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # Commits only (tree:0): every branch and tag, without the files of any.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: /${{ inputs.compose-file }}
          sparse-checkout-cone-mode: false
      - name: Refuse a tag off the release branch
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! sha="$(git rev-parse --verify --quiet "$TAG^{commit}")"; then
            echo "::error::The tag $TAG names no commit in $REPOSITORY."
            exit 1
          fi
          branch="${RELEASE_BRANCH:-$DEFAULT_BRANCH}"
          if [ -z "$branch" ]; then
            echo "::error::The event names no default branch; set the release-branch input."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$branch" > /dev/null; then
            echo "::error::The release branch $branch does not exist in $REPOSITORY."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "refs/remotes/origin/$branch"; then
            echo "::error::The commit $sha of $TAG is not on $branch; only a commit on the release branch deploys."
            exit 1
          fi
          echo "The commit $sha of $TAG is on $branch."

  build:
    name: build and push the image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest || steps.retag.outputs.digest }}
    steps:
      - if: inputs.prebuilt-image == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          # A folder the image never needs (screenshots, archives) is not downloaded; .dockerignore only keeps it
          # out of the build context after the download.
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@v4
      # The end-to-end test builds the image without pushing it anywhere.
      - if: ${{ !inputs.e2e }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Image reference
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
      - id: push
        if: inputs.prebuilt-image == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ !inputs.e2e }}
          # The end-to-end test hands the image to the deploy job as a `docker load` archive instead.
          outputs: ${{ inputs.e2e && format('type=docker,dest={0}/deploy-e2e-image.tar', runner.temp) || '' }}
          tags: ${{ steps.ref.outputs.image }}
          build-args: ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The tested image gets the release tag; with one source, imagetools copies its manifest unchanged, so the tag's
      # digest must be the one the caller passed.
      - id: retag
        name: Tag the prebuilt image
        if: inputs.prebuilt-image != ''
        env:
          PREBUILT_IMAGE: ${{ inputs.prebuilt-image }}
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          digest="${PREBUILT_IMAGE##*@}"
          docker buildx imagetools create --tag "$IMAGE_REF" "$PREBUILT_IMAGE"
          tagged="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [ "$tagged" != "$digest" ]; then
            echo "::error::$IMAGE_REF has the digest ${tagged:-none} after the tag, not $digest; nothing is deployed."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Tagged $PREBUILT_IMAGE as $IMAGE_REF."
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-e2e-image
          path: ${{ runner.temp }}/deploy-e2e-image.tar
          if-no-files-found: error
          retention-days: 1
          # The image's layers are compressed already.
          compression-level: 0

  deploy:
    name: deploy over SSH
    needs: [check, build]
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read for the registry token the server pulls with.
    permissions:
      contents: read
      packages: read
    outputs:
      server-lines: ${{ steps.send.outputs.server-lines }}
    environment: ${{ inputs.environment }}
    # One deploy at a time per app and environment; a running deploy is never cancelled halfway. End-to-end runs deploy
    # to their own server, so each has its own group and none waits for or replaces another.
    concurrency:
      group: deploy-app-${{ github.repository }}-${{ inputs.environment }}${{ inputs.e2e && format('-e2e-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      # End-to-end test only (refused outside SOFTURE/AI by the check job): the server files at the workspace root for
      # the server the runner becomes, the CLI of the tag itself, built from a full checkout, so the test needs no
      # published version, the image the build job handed over, and this runner set up as the server.
      - if: inputs.e2e
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: ${{ needs.check.outputs.server-files }}
          sparse-checkout-cone-mode: false
      - if: inputs.e2e
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - if: inputs.e2e
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          path: .softure-ai-cli
      - name: Build the deploy CLI from the tag (end-to-end test)
        if: inputs.e2e
        working-directory: .softure-ai-cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - if: inputs.e2e
        uses: actions/download-artifact@v8
        with:
          name: deploy-e2e-image
          path: ${{ runner.temp }}/e2e-image
      - id: e2e-server
        name: Set up this runner as the server (end-to-end test)
        if: inputs.e2e
        env:
          SSH_PORT: ${{ inputs.ssh-port }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVER_SCRIPT: ${{ inputs.server-script }}
          APP_URL: ${{ inputs.app-url }}
        run: |
          E2E_DIR="$RUNNER_TEMP/e2e-server" IMAGE_ARCHIVE="$RUNNER_TEMP/e2e-image/deploy-e2e-image.tar" \
            DEPLOY_CLI="$GITHUB_WORKSPACE/.softure-ai-cli/tools/deploy/dist/cli/main.js" \
            bash .softure-ai-cli/tools/deploy/e2e/start-server.sh
      # The deploy action of this workflow's own commit, so the steps below are the ones this workflow was tested with.
      # After the end-to-end checkout at the workspace root, which would delete it.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .softure-ai-deploy
          persist-credentials: false
          sparse-checkout: /.github/actions/deploy/
          sparse-checkout-cone-mode: false
      # Render, pack and send (the deploy action) with the named secrets; the end-to-end test points the same steps at its
      # throwaway server.
      - id: send
        uses: ./.softure-ai-deploy/.github/actions/deploy
        with:
          release: ${{ needs.check.outputs.release }}
          send: true
          verify: false
          report: false
          ssh-host: ${{ inputs.e2e && steps.e2e-server.outputs.host || secrets.ssh-host }}
          ssh-user: ${{ inputs.e2e && steps.e2e-server.outputs.user || secrets.ssh-user }}
          ssh-private-key: ${{ inputs.e2e && steps.e2e-server.outputs.private-key || secrets.ssh-private-key }}
          ssh-known-hosts: ${{ inputs.e2e && steps.e2e-server.outputs.known-hosts || secrets.ssh-known-hosts }}
          app-secrets: ${{ secrets.app-secrets }}
          secrets-context: false
          app-vars: ${{ inputs.app-vars }}
          deploy-cli: ${{ inputs.e2e && format('{0}/.softure-ai-cli/tools/deploy/dist/cli/main.js', github.workspace) || '' }}
      # What the end-to-end server recorded: names, hashes and the command line, never a value of .env.prod.
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-e2e-received
          path: ${{ runner.temp }}/e2e-server/received/
          if-no-files-found: error
          retention-days: 7
      # The verify job's steps (the deploy action's verify), here because the end-to-end stack runs on this runner. The
      # runner trusts the run's CA (curl); Node takes it from ca-file.
      - if: inputs.e2e
        uses: ./.softure-ai-deploy/.github/actions/deploy
        with:
          release: ${{ needs.check.outputs.release }}
          send: false
          verify: true
          report: false
          deploy-cli: ${{ format('{0}/.softure-ai-cli/tools/deploy/dist/cli/main.js', github.workspace) }}
          ca-file: ${{ steps.e2e-server.outputs.ca-file }}
      - name: Show the server's log and the stack (end-to-end test)
        if: always() && inputs.e2e
        run: |
          sudo cat "$RUNNER_TEMP/e2e-server/server/sshd.log" || true
          docker ps --all || true
          for container in $(docker ps --all --quiet --filter label=com.docker.compose.project); do
            echo "::group::docker logs $container"
            docker logs --tail 200 "$container" || true
            echo "::endgroup::"
          done
      - name: Remove the end-to-end server and image
        if: always() && inputs.e2e
        run: rm -rf "$RUNNER_TEMP/e2e-server" "$RUNNER_TEMP/e2e-image"

  verify:
    name: verify the release
    needs: [check, deploy]
    # The end-to-end test's stack runs on the deploy job's runner, so that job runs these steps itself.
    if: ${{ inputs.deploy && !inputs.e2e }}
    # Outside the environment, so a protected environment is not asked twice.
    runs-on: ubuntu-latest
    # Above the longest verify-timeout-seconds the check job accepts (9999 s).
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .softure-ai-deploy
          persist-credentials: false
          sparse-checkout: /.github/actions/deploy/
          sparse-checkout-cone-mode: false
      # The origin address from the secret, or from the app-vars entry origin-address-var names (the check job made
      # sure it exists, holds an address and never comes with the secret). The secret verify-env: a JSON object of
      # variables for the CLI only.
      - uses: ./.softure-ai-deploy/.github/actions/deploy
        with:
          release: ${{ needs.check.outputs.release }}
          send: false
          verify: true
          report: false
          origin-address: ${{ inputs.origin-address-var != '' && fromJSON(inputs.app-vars)[inputs.origin-address-var] || secrets.origin-address }}
          verify-env: ${{ secrets.verify-env }}

  # The facts of this run for the release report (deploy-report.yml, DF-10), whatever happened: each job's result, the
  # image and its digest, and the server's step lines. It writes nothing anywhere but the run's artifact
  # `deploy-report`; a re-run of failed jobs replaces it.
  summary:
    name: summarize the run
    needs: [check, build, deploy, verify]
    if: ${{ always() && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write deploy-report.json
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SERVER_LINES: ${{ needs.deploy.outputs.server-lines }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-report"
          jq -n \
            --arg tag "$TAG" --arg environment "$DEPLOY_ENVIRONMENT" --arg image "$IMAGE" --arg digest "$DIGEST" \
            --arg runUrl "$RUN_URL" --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg check "$CHECK_RESULT" --arg build "$BUILD_RESULT" --arg deploy "$DEPLOY_RESULT" --arg verify "$VERIFY_RESULT" \
            --arg lines "$SERVER_LINES" \
            '{version: 1, tag: $tag, environment: $environment, image: $image, digest: $digest, runUrl: $runUrl,
              finishedAt: $finishedAt,
              jobs: [{name: "check", result: $check}, {name: "build", result: $build},
                     {name: "deploy", result: $deploy}, {name: "verify", result: $verify}],
              serverLines: ($lines | split("\n") | map(select(length > 0)))}' \
            > "$RUNNER_TEMP/deploy-report/deploy-report.json"
          cat "$RUNNER_TEMP/deploy-report/deploy-report.json"
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-report
          path: ${{ runner.temp }}/deploy-report/deploy-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
