# Release of one app to its VPS (@softure-ai/deploy, DP-2): a reusable workflow an app calls with one `uses:` line.
# It builds the image from the release tag and pushes it to GHCR, renders `.env.prod` from the app's secrets with
# `softure-deploy env render`, hands it to the server's forced SSH command, and verifies the release.
#
# An app that tests its image before the release passes it as `prebuilt-image` (`<image>@sha256:<digest>`, from the
# same repository): nothing is built, the release tag is added to exactly that image, and the server pulls it by tag,
# so production runs the bytes the tests saw.
#
# The caller is `tools/deploy/examples/deploy.yml` in this repository: copy it to the app's `.github/workflows/`.
# It grants `contents: read` and `packages: write`; the jobs below take only what each one needs.
#
# The server side (generated by `softure-deploy init`, DP-5): the deploy key is bound to a forced command in
# `authorized_keys`, which receives `SSH_ORIGINAL_COMMAND="<remote-command> <tag>"` and the release archive on stdin
# (DF-7): a gzip tar of the compose file's folder (`docker/prod/`), the `server-script`, the app's `deploy-config` (as
# `deploy.json`), the rendered `.env.prod` and the registry token (`.registry-token`, DF-11). It installs the files
# next to itself (never the token), pulls `<image>:<tag>` and restarts the stack, so a changed compose file, Traefik
# rule or server script ships with the release that needs it. The release counts only when the server's output holds
# the line `result|ok` (init's deploy.sh prints it, DF-9).
# The host key is checked against `ssh-known-hosts`, never learned on first use.
#
# Verify waits for the health route, then runs `softure-deploy verify <app-url>` (DP-4) with the app's `deploy.json`
# from the tag: every route, status, marker, redirect and header the app lists. `deploy-config: ""` keeps the health
# route only. With the `origin-address` secret (or the app-vars entry `origin-address-var` names), verify also fails
# when the server accepts a direct connection (DF-13): only the CDN may reach it.
#
# Release guards (DF-11): the `check` job refuses a tag whose commit is not on the release branch (the caller's default
# branch unless `release-branch` names another). `build-args` are baked into the image (public values only: they are
# readable in the image's history), and a build argument whose name `.env.prod` also holds must carry the same value
# there (an origin in the image that differs from the runtime one broke every write of an adopting app).
# `app-vars` are non-secret values (e.g. toJSON(vars)) rendered over `app-secrets`, so a switch like `1` is not masked
# in every log line. The deploy job's own GITHUB_TOKEN (packages: read, valid until the job ends) rides in the archive
# as `.registry-token`; the server pulls with it through a throwaway Docker config and keeps no registry login.
#
# Every input is validated by the `check` job before anything is built or sent, and every value reaches a script
# through `env:`, never interpolated into it. The CLI comes from npm (`deploy-cli-version`), so the workflow runs once
# @softure-ai/deploy is published (DP-8).
#
# Secrets come one of two ways. By name: the caller passes `app-secrets` and the four SSH secrets from its own context,
# which holds repository and organization secrets only (a job with `uses:` cannot name an environment). From the
# environment (`secrets-from-environment: true`, the caller passes `secrets: inherit`): the deploy job, which runs in
# `environment`, builds the app's secrets from its own `secrets` context, where the environment's secrets win over the
# repository's, and reads the SSH values by the names the `*-secret` inputs give. So secrets kept behind an
# environment's deployment policy reach the release without repository-level copies. The verify job runs outside the
# environment; its origin address can come from an `app-vars` entry (`origin-address-var`) on either way.
#
# Variables for verify (a Web Bot Auth key a `webBotAuth` route signs with): the secret `verify-env`, a JSON object of
# text values by name, or with `secrets-from-environment` the environment secret `verify-env-secret` names, holding the
# same object, which puts the verify job in `environment` too (a protected environment with required reviewers asks
# again). Only that one secret reaches the job, never the whole secrets context. The verify step masks each value and
# hands the variables to `softure-deploy verify` only; a name the step or the runner sets itself is refused.
#
# Whatever happened, the `summary` job uploads the run's facts (each job's result, the image, its digest and the
# server's step lines) as the artifact `deploy-report`; the caller's second job, deploy-report.yml (DF-10), writes them
# into the tag's GitHub Release.
#
# `e2e: true` is this repository's own end-to-end test (.github/workflows/e2e-deploy.yml, DF-3, DF-15) and is refused
# in any other repository. On that path nothing leaves the runners: the image is built without a push and handed to
# the deploy job as the artifact `deploy-e2e-image`, the CLI runs from the tag's checkout, and the deploy job's runner
# becomes the server (tools/deploy/e2e/start-server.sh): a registry holding the image, a certificate for the app's host
# from a CA of the run, and sshd whose forced command records what it received and runs the tag's deploy.sh, which
# brings the stack up on the runner. The send step's ssh command is the production one pointed at it. The verify job's
# two steps then run in the deploy job (the stack lives on its runner) with the tag's CLI; the recording is uploaded
# as the artifact `deploy-e2e-received` for the caller to check.

name: deploy-app

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy (a git tag of the app; also the image tag)
        type: string
        required: true
      app-url:
        description: The app's public base URL, e.g. https://example.com (the verify target)
        type: string
        required: true
      image:
        description: Image name without a tag; empty means ghcr.io/<owner>/<repository> of the caller, lower-cased
        type: string
        default: ""
      prebuilt-image:
        description: "An image already built and tested, by digest: <image>@sha256:<64 hex>, the repository of image. Skips the build and tags that image with the release tag; empty builds from the tag"
        type: string
        default: ""
      context:
        description: Docker build context in the app's repository
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path in the app's repository
        type: string
        default: Dockerfile
      compose-file:
        description: Production compose file whose required variables (${NAME:?}) name the secrets to render; its folder ships to the server
        type: string
        default: docker/prod/docker-compose.yml
      server-script:
        description: The server's forced command in the app's repository; each release installs it as deploy.sh
        type: string
        default: docker/server/deploy.sh
      environment:
        description: GitHub environment of the deploy job (protection rules; its secrets reach the release only with secrets-from-environment); empty for none
        type: string
        default: ""
      secrets-from-environment:
        description: The deploy job reads app-secrets (its whole secrets context) and the SSH values (named by the *-secret inputs) from environment; the caller passes secrets inherit instead of named secrets
        type: boolean
        default: false
      ssh-host-secret:
        description: With secrets-from-environment, the secret holding the server host name or IP address
        type: string
        default: DEPLOY_SSH_HOST
      ssh-user-secret:
        description: With secrets-from-environment, the secret holding the SSH user
        type: string
        default: DEPLOY_SSH_USER
      ssh-private-key-secret:
        description: With secrets-from-environment, the secret holding the private deploy key
        type: string
        default: DEPLOY_SSH_KEY
      ssh-known-hosts-secret:
        description: With secrets-from-environment, the secret holding the server's known_hosts line(s)
        type: string
        default: DEPLOY_SSH_KNOWN_HOSTS
      origin-address-var:
        description: Name of an app-vars entry holding the origin address (instead of the origin-address secret, which secrets-from-environment cannot pass); empty for none
        type: string
        default: ""
      verify-env-secret:
        description: With secrets-from-environment, the secret holding verify-env's JSON object (variables exported for softure-deploy verify, e.g. WEB_BOT_AUTH_PRIVATE_KEY); the verify job then runs in environment. Empty for none
        type: string
        default: ""
      remote-command:
        description: First word sent to the server's forced command, followed by the tag
        type: string
        default: deploy
      ssh-port:
        description: SSH port of the server
        type: number
        default: 22
      health-path:
        description: Route that answers 200 once the new release is up
        type: string
        default: /api/health
      verify-timeout-seconds:
        description: How long verify waits for the health route to answer 200
        type: number
        default: 300
      deploy-config:
        description: The app's deploy.json in the tag, verified and shipped to the server; empty means the health route only
        type: string
        default: deploy.json
      deploy-cli-version:
        description: Version of @softure-ai/deploy that renders .env.prod and verifies the release
        type: string
        default: 0.1.9
      node-version:
        description: Node.js version that runs the deploy CLI
        type: string
        default: "22"
      sparse-checkout:
        description: "Checkout patterns for the image build, non-cone (e.g. /* and !/context/archive/); empty = the whole tag"
        type: string
        default: ""
      release-branch:
        description: Branch the tag's commit must be on; empty means the caller's default branch
        type: string
        default: ""
      build-args:
        description: "Build arguments baked into the image, one NAME=value per line; public values only. A name .env.prod also holds must carry the same value there"
        type: string
        default: ""
      app-vars:
        description: JSON object of non-secret values by name, e.g. toJSON(vars); rendered like app-secrets and taking precedence over them
        type: string
        default: "{}"
      secret-min-lengths:
        description: "Shortest allowed length of rendered values, NAME=N separated by spaces or newlines (env render --min-length)"
        type: string
        default: ""
      registry-token:
        description: Send the deploy job's short-lived GITHUB_TOKEN with the release, so the server pulls without a registry login of its own
        type: boolean
        default: true
      e2e:
        description: SOFTURE/AI's own end-to-end test only (e2e-deploy.yml); refused in any other repository
        type: boolean
        default: false
    # Required unless secrets-from-environment is on, which takes them from the environment instead; the check job
    # refuses a missing one by name. Not `required: true`, because a caller with `secrets: inherit` cannot pass them.
    secrets:
      ssh-host:
        description: Server host name or IP address (required without secrets-from-environment)
        required: false
      ssh-user:
        description: User whose authorized_keys binds the deploy key to the forced command (required without secrets-from-environment)
        required: false
      ssh-private-key:
        description: Private deploy key, OpenSSH format (required without secrets-from-environment)
        required: false
      ssh-known-hosts:
        description: known_hosts line(s) of the server, e.g. from `ssh-keyscan` run once by the owner and checked (required without secrets-from-environment)
        required: false
      app-secrets:
        description: JSON object of the app's runtime secrets by name, e.g. toJSON(secrets) (required without secrets-from-environment)
        required: false
      origin-address:
        description: >-
          The server's own address behind the CDN (IP or host, optional :port, default 443), e.g. vars.DEPLOY_IP;
          verify fails when it accepts a direct connection. Empty skips the check. Needs deploy-config.
        required: false
      verify-env:
        description: >-
          JSON object of variables by name exported for softure-deploy verify only, masked, e.g.
          {"WEB_BOT_AUTH_PRIVATE_KEY": "..."} for a webBotAuth route. Without secrets-from-environment (which uses
          verify-env-secret). Needs deploy-config.
        required: false
    outputs:
      image:
        description: The pushed image reference with its tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  check:
    name: check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The branch guard reads the tag's history.
    permissions:
      contents: read
    outputs:
      image: ${{ steps.inputs.outputs.image }}
      server-files: ${{ steps.inputs.outputs.server-files }}
    steps:
      - id: inputs
        name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          APP_URL: ${{ inputs.app-url }}
          IMAGE: ${{ inputs.image }}
          PREBUILT_IMAGE: ${{ inputs.prebuilt-image }}
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVER_SCRIPT: ${{ inputs.server-script }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          REMOTE_COMMAND: ${{ inputs.remote-command }}
          SSH_PORT: ${{ inputs.ssh-port }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          BUILD_ARGS: ${{ inputs.build-args }}
          E2E: ${{ inputs.e2e }}
          REPOSITORY: ${{ github.repository }}
          ORIGIN_ADDRESS: ${{ secrets.origin-address }}
          ORIGIN_ADDRESS_VAR: ${{ inputs.origin-address-var }}
          APP_VARS: ${{ inputs.app-vars }}
          SECRETS_FROM_ENVIRONMENT: ${{ inputs.secrets-from-environment }}
          SSH_HOST_SECRET: ${{ inputs.ssh-host-secret }}
          SSH_USER_SECRET: ${{ inputs.ssh-user-secret }}
          SSH_PRIVATE_KEY_SECRET: ${{ inputs.ssh-private-key-secret }}
          SSH_KNOWN_HOSTS_SECRET: ${{ inputs.ssh-known-hosts-secret }}
          VERIFY_ENV: ${{ secrets.verify-env }}
          VERIFY_ENV_SECRET: ${{ inputs.verify-env-secret }}
          VERIFY_ENV_RULES: >-
            if type != "object" or any(.[]; type != "string") then "a JSON object of text values by name"
            else keys_unsorted[]
              | if test("^[A-Za-z_][A-Za-z0-9_]*$") | not then "\(.) is not a name (letters, digits, _)"
                elif ascii_upcase | test("^(APP_URL|DEPLOY_CONFIG|DEPLOY_CLI_VERSION|ORIGIN_ADDRESS|ORIGIN_ADDRESS_VAR|APP_VARS|VERIFY_ENV|VERIFY_ENV_SECRET|VERIFY_ENV_RULES|PATH|HOME|NODE_.*|NPM_CONFIG_.*)$")
                then "\(.) is reserved for the verify step or the runner"
                else empty end
            end
          # The names of the named secrets the caller passed, never a value.
          PASSED_SECRETS: >-
            ${{ secrets.ssh-host != '' && 'ssh-host' || '' }}
            ${{ secrets.ssh-user != '' && 'ssh-user' || '' }}
            ${{ secrets.ssh-private-key != '' && 'ssh-private-key' || '' }}
            ${{ secrets.ssh-known-hosts != '' && 'ssh-known-hosts' || '' }}
            ${{ secrets.app-secrets != '' && 'app-secrets' || '' }}
            ${{ secrets.verify-env != '' && 'verify-env' || '' }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          expect() {
            if [[ ! "$2" =~ $3 ]]; then reject "$1" "$4"; fi
          }
          expect_path() {
            expect "$1" "$2" '^[A-Za-z0-9_.][A-Za-z0-9_./-]*$' "a relative path"
            if [[ "/$2/" == */../* ]]; then reject "$1" "a path without .. segments"; fi
          }
          expect tag "$TAG" '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' "a Docker tag (letters, digits, _ . -; at most 128)"
          expect app-url "$APP_URL" '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$' "https://<host>[:port] with no path"
          expect_path context "$BUILD_CONTEXT"
          expect_path dockerfile "$DOCKERFILE"
          expect_path compose-file "$COMPOSE_FILE"
          # The compose file's folder ships to the server; at the root it would be the whole tag.
          if [[ "$COMPOSE_FILE" != */* ]]; then reject compose-file "a file inside a folder (the folder ships to the server)"; fi
          expect_path server-script "$SERVER_SCRIPT"
          expect environment "$DEPLOY_ENVIRONMENT" '^[A-Za-z0-9_. -]{0,255}$' "letters, digits, space, _ . -"
          expect remote-command "$REMOTE_COMMAND" '^[a-z][a-z0-9-]{0,31}$' "one lower-case word"
          if [[ ! "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( SSH_PORT > 65535 )); then reject ssh-port "1 to 65535"; fi
          expect health-path "$HEALTH_PATH" '^/[A-Za-z0-9/._~-]*$' "a path starting with /"
          expect verify-timeout-seconds "$VERIFY_TIMEOUT" '^[1-9][0-9]{1,3}$' "10 to 9999 seconds"
          if [ -n "$DEPLOY_CONFIG" ]; then expect_path deploy-config "$DEPLOY_CONFIG"; fi
          # Secrets by name, or the deploy job reads them from its environment (secrets: inherit); never both.
          if [ "${SECRETS_FROM_ENVIRONMENT:-false}" = "true" ]; then
            if [ -z "$DEPLOY_ENVIRONMENT" ]; then
              reject secrets-from-environment "false without environment (the deploy job reads that environment's secrets)"
            fi
            for name in ${PASSED_SECRETS:-}; do
              if [ "$name" = "verify-env" ]; then
                reject secrets-from-environment "false when the secret verify-env is passed (name an environment secret in verify-env-secret)"
              else
                reject secrets-from-environment "false when the secret $name is passed (pass secrets: inherit instead)"
              fi
            done
            if [ -n "$ORIGIN_ADDRESS" ]; then
              reject secrets-from-environment "false when the secret origin-address is passed (use origin-address-var)"
            fi
            expect ssh-host-secret "${SSH_HOST_SECRET:-}" '^[A-Za-z_][A-Za-z0-9_]*$' "a secret name (letters, digits, _)"
            expect ssh-user-secret "${SSH_USER_SECRET:-}" '^[A-Za-z_][A-Za-z0-9_]*$' "a secret name (letters, digits, _)"
            expect ssh-private-key-secret "${SSH_PRIVATE_KEY_SECRET:-}" '^[A-Za-z_][A-Za-z0-9_]*$' "a secret name (letters, digits, _)"
            expect ssh-known-hosts-secret "${SSH_KNOWN_HOSTS_SECRET:-}" '^[A-Za-z_][A-Za-z0-9_]*$' "a secret name (letters, digits, _)"
          else
            for name in ssh-host ssh-user ssh-private-key ssh-known-hosts app-secrets; do
              if [[ " ${PASSED_SECRETS:-} " != *" $name "* ]]; then
                echo "::error::Secret $name is required: pass it, or set secrets-from-environment with secrets: inherit."
                failures=$((failures + 1))
              fi
            done
          fi
          origin_input=origin-address
          # The origin address from an app-vars entry, for a caller whose secrets stay in the environment (the verify
          # job runs outside it). Not a secret, so it is printed like any app-vars value.
          if [ -n "${ORIGIN_ADDRESS_VAR:-}" ]; then
            if [[ ! "$ORIGIN_ADDRESS_VAR" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              reject origin-address-var "a name (letters, digits, _)"
            elif [ -n "$ORIGIN_ADDRESS" ]; then
              reject origin-address-var "empty when the secret origin-address is passed (one source)"
            else
              ORIGIN_ADDRESS="$(printf '%s' "${APP_VARS:-}" | jq -r --arg name "$ORIGIN_ADDRESS_VAR" '.[$name] | strings' 2> /dev/null || true)"
              origin_input=origin-address-var
              if [ -z "$ORIGIN_ADDRESS" ]; then reject origin-address-var "the name of a text entry in app-vars"; fi
            fi
          fi
          if [ -n "$ORIGIN_ADDRESS" ]; then
            expect "$origin_input" "$ORIGIN_ADDRESS" '^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?$|^[0-9A-Fa-f:.]+$' "an IP address or host with an optional :port"
            # The origin is checked by the verify step, which runs only with a config: refuse a check that would not run.
            if [ -z "$DEPLOY_CONFIG" ]; then reject "$origin_input" "empty when deploy-config is empty (verify runs with deploy.json)"; fi
          fi
          # The verify step's variables: the secret verify-env is checked here, before anything is built; the one
          # verify-env-secret names lives in the environment, so the verify step checks it the same way.
          if [ -n "${VERIFY_ENV_SECRET:-}" ]; then
            if [ "${SECRETS_FROM_ENVIRONMENT:-false}" != "true" ]; then
              reject verify-env-secret "empty without secrets-from-environment (pass the secret verify-env instead)"
            elif [[ ! "$VERIFY_ENV_SECRET" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              reject verify-env-secret "a secret name (letters, digits, _)"
            elif [ -z "$DEPLOY_CONFIG" ]; then
              reject verify-env-secret "empty when deploy-config is empty (verify runs with deploy.json)"
            fi
          fi
          if [ -n "${VERIFY_ENV:-}" ] && [ "${SECRETS_FROM_ENVIRONMENT:-false}" != "true" ]; then
            if [ -z "$DEPLOY_CONFIG" ]; then
              reject verify-env "empty when deploy-config is empty (verify runs with deploy.json)"
            else
              while IFS= read -r problem; do
                if [ -n "$problem" ]; then reject verify-env "$problem"; fi
              done < <(printf '%s' "$VERIFY_ENV" | jq -r "$VERIFY_ENV_RULES" 2> /dev/null || echo "a JSON object of text values by name")
            fi
          fi
          expect deploy-cli-version "$DEPLOY_CLI_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' "an exact version"
          if [ -n "${RELEASE_BRANCH:-}" ]; then
            expect release-branch "$RELEASE_BRANCH" '^[A-Za-z0-9_.][A-Za-z0-9_./-]{0,254}$' "a branch name"
            if [[ "$RELEASE_BRANCH" == *..* || "$RELEASE_BRANCH" == */ ]]; then reject release-branch "a branch name"; fi
          fi
          # One NAME=value per line, each name once: docker/build-push-action reads the same list.
          # Names seen so far, one per line between newlines: bash 3.2 (macOS, where the tests run this step) has no
          # associative arrays, and a name holds no newline.
          build_arg_names=$'\n'
          line_number=0
          while IFS= read -r line; do
            line_number=$((line_number + 1))
            if [[ "$line" =~ ^[[:space:]]*$ ]]; then continue; fi
            if [[ ! "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)= ]]; then
              reject build-args "NAME=value lines (line $line_number is not)"
              continue
            fi
            name="${BASH_REMATCH[1]}"
            if [[ "$build_arg_names" == *$'\n'"$name"$'\n'* ]]; then reject build-args "each name once ($name repeats)"; fi
            build_arg_names+="$name"$'\n'
          done <<< "${BUILD_ARGS:-}"
          # The test path builds the CLI from a full checkout of the tag; only this repository's tags are trusted so.
          if [ "$E2E" = "true" ] && [ "$REPOSITORY" != "SOFTURE/AI" ]; then
            reject e2e "false outside SOFTURE/AI (it is that repository's own end-to-end test)"
          fi
          if [ -z "$IMAGE" ]; then IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"; fi
          expect image "$IMAGE" '^[a-z0-9.-]+(:[0-9]{1,5})?(/[a-z0-9]+([._-][a-z0-9]+)*)+$' "registry/name, lower case, no tag"
          # By digest only: a tag could move between the tests and the release. The same repository, so the re-tag
          # copies no layers and the server pulls what the image input names.
          if [ -n "${PREBUILT_IMAGE:-}" ]; then
            if [[ ! "$PREBUILT_IMAGE" =~ ^(.+)@sha256:[0-9a-f]{64}$ ]] || [ "${BASH_REMATCH[1]}" != "$IMAGE" ]; then
              reject prebuilt-image "$IMAGE@sha256:<64 hex digits> (the image input's repository, by digest)"
            fi
            if [ "$E2E" = "true" ]; then reject prebuilt-image "empty with e2e (the end-to-end test builds its own image)"; fi
          fi
          if (( failures > 0 )); then exit 1; fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # Anchored non-cone patterns: the deploy job fetches only these, so no .npmrc of the app steers npx.
          prod_dir="${COMPOSE_FILE%/*}"
          {
            echo "server-files<<SERVER_FILES"
            echo "/$prod_dir/"
            echo "/$SERVER_SCRIPT"
            if [ -n "$DEPLOY_CONFIG" ]; then echo "/$DEPLOY_CONFIG"; fi
            echo "SERVER_FILES"
          } >> "$GITHUB_OUTPUT"
      # Commits only (tree:0): every branch and tag, without the files of any.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: /${{ inputs.compose-file }}
          sparse-checkout-cone-mode: false
      - name: Refuse a tag off the release branch
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! sha="$(git rev-parse --verify --quiet "$TAG^{commit}")"; then
            echo "::error::The tag $TAG names no commit in $REPOSITORY."
            exit 1
          fi
          branch="${RELEASE_BRANCH:-$DEFAULT_BRANCH}"
          if [ -z "$branch" ]; then
            echo "::error::The event names no default branch; set the release-branch input."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$branch" > /dev/null; then
            echo "::error::The release branch $branch does not exist in $REPOSITORY."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "refs/remotes/origin/$branch"; then
            echo "::error::The commit $sha of $TAG is not on $branch; only a commit on the release branch deploys."
            exit 1
          fi
          echo "The commit $sha of $TAG is on $branch."

  build:
    name: build and push the image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest || steps.retag.outputs.digest }}
    steps:
      - if: inputs.prebuilt-image == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          # A folder the image never needs (screenshots, archives) is not downloaded; .dockerignore only keeps it
          # out of the build context after the download.
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@v4
      # The end-to-end test builds the image without pushing it anywhere.
      - if: ${{ !inputs.e2e }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Image reference
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          TAG: ${{ inputs.tag }}
        run: echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
      - id: push
        if: inputs.prebuilt-image == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ !inputs.e2e }}
          # The end-to-end test hands the image to the deploy job as a `docker load` archive instead.
          outputs: ${{ inputs.e2e && format('type=docker,dest={0}/deploy-e2e-image.tar', runner.temp) || '' }}
          tags: ${{ steps.ref.outputs.image }}
          build-args: ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The tested image gets the release tag; with one source, imagetools copies its manifest unchanged, so the tag's
      # digest must be the one the caller passed.
      - id: retag
        name: Tag the prebuilt image
        if: inputs.prebuilt-image != ''
        env:
          PREBUILT_IMAGE: ${{ inputs.prebuilt-image }}
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          digest="${PREBUILT_IMAGE##*@}"
          docker buildx imagetools create --tag "$IMAGE_REF" "$PREBUILT_IMAGE"
          tagged="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [ "$tagged" != "$digest" ]; then
            echo "::error::$IMAGE_REF has the digest ${tagged:-none} after the tag, not $digest; nothing is deployed."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Tagged $PREBUILT_IMAGE as $IMAGE_REF."
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-e2e-image
          path: ${{ runner.temp }}/deploy-e2e-image.tar
          if-no-files-found: error
          retention-days: 1
          # The image's layers are compressed already.
          compression-level: 0

  deploy:
    name: deploy over SSH
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read for the registry token the server pulls with.
    permissions:
      contents: read
      packages: read
    outputs:
      server-lines: ${{ steps.server-lines.outputs.lines }}
    environment: ${{ inputs.environment }}
    # One deploy at a time per app and environment; a running deploy is never cancelled halfway. End-to-end runs deploy
    # to their own server, so each has its own group and none waits for or replaces another.
    concurrency:
      group: deploy-app-${{ github.repository }}-${{ inputs.environment }}${{ inputs.e2e && format('-e2e-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: ${{ needs.check.outputs.server-files }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      # End-to-end test only (refused outside SOFTURE/AI by the check job): the CLI of the tag itself, built from a full
      # checkout, so the test needs no published version, the image the build job handed over, and this runner set up
      # as the server the release is sent to.
      - if: inputs.e2e
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          path: .softure-ai-cli
      - name: Build the deploy CLI from the tag (end-to-end test)
        if: inputs.e2e
        working-directory: .softure-ai-cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - if: inputs.e2e
        uses: actions/download-artifact@v8
        with:
          name: deploy-e2e-image
          path: ${{ runner.temp }}/e2e-image
      - id: e2e-server
        name: Set up this runner as the server (end-to-end test)
        if: inputs.e2e
        env:
          SSH_PORT: ${{ inputs.ssh-port }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVER_SCRIPT: ${{ inputs.server-script }}
          APP_URL: ${{ inputs.app-url }}
        run: |
          E2E_DIR="$RUNNER_TEMP/e2e-server" IMAGE_ARCHIVE="$RUNNER_TEMP/e2e-image/deploy-e2e-image.tar" \
            DEPLOY_CLI="$GITHUB_WORKSPACE/.softure-ai-cli/tools/deploy/dist/cli/main.js" \
            bash .softure-ai-cli/tools/deploy/e2e/start-server.sh
      # With secrets-from-environment, every SSH value must be a secret of the job's context (the environment's or the
      # repository's) before anything is rendered or sent. Names only, never a value.
      - name: Check the environment's SSH secrets
        if: inputs.secrets-from-environment && !inputs.e2e
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SSH_SECRET_NAMES: >-
            ${{ inputs.ssh-host-secret }} ${{ inputs.ssh-user-secret }}
            ${{ inputs.ssh-private-key-secret }} ${{ inputs.ssh-known-hosts-secret }}
          MISSING_SECRETS: >-
            ${{ secrets[inputs.ssh-host-secret] == '' && inputs.ssh-host-secret || '' }}
            ${{ secrets[inputs.ssh-user-secret] == '' && inputs.ssh-user-secret || '' }}
            ${{ secrets[inputs.ssh-private-key-secret] == '' && inputs.ssh-private-key-secret || '' }}
            ${{ secrets[inputs.ssh-known-hosts-secret] == '' && inputs.ssh-known-hosts-secret || '' }}
        run: |
          missing="$(printf '%s' "${MISSING_SECRETS:-}" | xargs)"
          if [ -n "$missing" ]; then
            echo "::error::The environment $DEPLOY_ENVIRONMENT (or the repository) has no secret ${missing// /, }; the deploy reads the SSH values from $(printf '%s' "$SSH_SECRET_NAMES" | xargs | sed 's/ /, /g')."
            exit 1
          fi
          echo "SSH values read from the secrets $(printf '%s' "$SSH_SECRET_NAMES" | xargs | sed 's/ /, /g')."
      # The app's secrets and values go to the CLI's environment only; it writes the compose file's required names to
      # .env.prod (mode 0600) and prints names, never values. Names that steer Node or npm itself are refused. A value
      # in app-vars wins over a secret of the same name. With secrets-from-environment the secrets are the job's whole
      # secrets context, which the app does not pick (github_token, the deploy key, an npm token): a reserved name there
      # is left out and named instead of stopping the release. Then each build argument whose name .env.prod holds must
      # carry the same value there; a difference removes the file and names the variable, never a value.
      - name: Render .env.prod
        env:
          APP_SECRETS: ${{ inputs.secrets-from-environment && toJSON(secrets) || secrets.app-secrets }}
          SECRETS_FROM_ENVIRONMENT: ${{ inputs.secrets-from-environment }}
          APP_VARS: ${{ inputs.app-vars }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SECRET_MIN_LENGTHS: ${{ inputs.secret-min-lengths }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          # Set on the end-to-end test only: the CLI built from the tag above instead of the published one.
          DEPLOY_CLI: ${{ inputs.e2e && format('{0}/.softure-ai-cli/tools/deploy/dist/cli/main.js', github.workspace) || '' }}
        run: |
          node - <<'JS'
          const { spawnSync } = require("node:child_process");
          const { readFileSync, rmSync } = require("node:fs");
          const RESERVED = /^(PATH|HOME|NODE_.*|NPM_CONFIG_.*)$/i;
          function readObject(variable, input) {
            let value = null;
            try {
              value = JSON.parse(process.env[variable] ?? "");
            } catch {
              // Reported below without echoing the value.
            }
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              console.log(`::error::${input} is not a JSON object of names and values.`);
              process.exit(1);
            }
            return value;
          }
          const secrets = readObject("APP_SECRETS", "app-secrets");
          const vars = readObject("APP_VARS", "app-vars");
          const env = { PATH: process.env.PATH, HOME: process.env.HOME };
          const overridden = [];
          const leftOut = [];
          const fromEnvironment = process.env.SECRETS_FROM_ENVIRONMENT === "true";
          for (const [input, values] of [["app-secrets", secrets], ["app-vars", vars]]) {
            for (const [name, value] of Object.entries(values)) {
              if (RESERVED.test(name) && input === "app-secrets" && fromEnvironment) {
                leftOut.push(name);
                continue;
              }
              if (RESERVED.test(name)) {
                console.log(`::error::${input}: ${name} is reserved for the runner and cannot be rendered.`);
                process.exit(1);
              }
              if (typeof value !== "string") continue;
              if (input === "app-vars" && typeof secrets[name] === "string") overridden.push(name);
              env[name] = value;
            }
          }
          if (overridden.length > 0) {
            console.log(`app-vars: ${overridden.sort().join(", ")} taken from app-vars over the secret of the same name.`);
          }
          if (leftOut.length > 0) {
            console.log(`app-secrets: ${leftOut.sort().join(", ")} left out, reserved for the runner.`);
          }
          const minLengths = (process.env.SECRET_MIN_LENGTHS ?? "").split(/\s+/).filter((spec) => spec !== "");
          const args = [
            "env",
            "render",
            `--compose=${process.env.COMPOSE_FILE}`,
            "--out=.env.prod",
            ...minLengths.map((spec) => `--min-length=${spec}`),
          ];
          const cli = process.env.DEPLOY_CLI;
          const result = cli
            ? spawnSync(process.execPath, [cli, ...args], { env, stdio: "inherit" })
            : spawnSync(
                "npx",
                ["--yes", `--package=@softure-ai/deploy@${process.env.DEPLOY_CLI_VERSION}`, "softure-deploy", ...args],
                { env, stdio: "inherit" },
              );
          if (result.status !== 0) process.exit(result.status ?? 1);
          // The names env render wrote; the values compared are the ones it was given.
          const rendered = new Set();
          for (const line of readFileSync(".env.prod", "utf8").split("\n")) {
            const match = /^([A-Za-z_][A-Za-z0-9_]*)=/.exec(line);
            if (match) rendered.add(match[1]);
          }
          const compared = [];
          const differing = [];
          for (const line of (process.env.BUILD_ARGS ?? "").split("\n")) {
            const entry = line.trim();
            const at = entry.indexOf("=");
            if (at <= 0) continue;
            const name = entry.slice(0, at);
            if (!rendered.has(name)) continue;
            compared.push(name);
            if (env[name] !== entry.slice(at + 1)) differing.push(name);
          }
          if (differing.length > 0) {
            rmSync(".env.prod", { force: true });
            console.log(
              `::error::build-args and .env.prod hold different values for ${differing.join(", ")}; ` +
                "the image and the runtime must agree, so set both to the same value.",
            );
            process.exit(1);
          }
          if (compared.length > 0) console.log(`build-args and .env.prod agree on ${compared.join(", ")}.`);
          JS
      # The archive's root is what lands next to deploy.sh on the server. Only regular files and folders: a symlink
      # in the tag could point anywhere on the runner or the server. The names below are the server's own; the
      # registry token is read by deploy.sh and never installed.
      - name: Pack the release
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVER_SCRIPT: ${{ inputs.server-script }}
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
          REGISTRY_TOKEN: ${{ inputs.registry-token && github.token || '' }}
        run: |
          prod_dir="${COMPOSE_FILE%/*}"
          failures=0
          for file in "$COMPOSE_FILE" "$SERVER_SCRIPT" ${DEPLOY_CONFIG:+"$DEPLOY_CONFIG"}; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::$file is not a file in the tag."
              failures=$((failures + 1))
            fi
          done
          odd="$(find "$prod_dir" ! -type f ! -type d 2> /dev/null || true)"
          if [ -n "$odd" ]; then
            echo "::error::$prod_dir holds something other than files and folders: ${odd//$'\n'/, }"
            failures=$((failures + 1))
          fi
          for name in .env.prod .env.prod.prev .registry-token deploy.sh deploy.json .deployed-tag .deploy.lock backups releases; do
            if [ -e "$prod_dir/$name" ]; then
              echo "::error::$prod_dir/$name is reserved on the server; rename it."
              failures=$((failures + 1))
            fi
          done
          if (( failures > 0 )); then exit 1; fi
          stage="$RUNNER_TEMP/release"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$prod_dir/." "$stage/"
          cp "$SERVER_SCRIPT" "$stage/deploy.sh"
          if [ -n "$DEPLOY_CONFIG" ]; then cp "$DEPLOY_CONFIG" "$stage/deploy.json"; fi
          (umask 077 && cp .env.prod "$stage/.env.prod")
          if [ -n "${REGISTRY_TOKEN:-}" ]; then (umask 077 && printf '%s\n' "$REGISTRY_TOKEN" > "$stage/.registry-token"); fi
          # GNU tar on the runner, bsdtar on macOS (where the tests run this step): the same owner, other flag names.
          if tar --version 2> /dev/null | grep -q 'GNU tar'; then owner_flags=(--owner=0 --group=0); else owner_flags=(--uid 0 --gid 0); fi
          tar -czf release.tar.gz "${owner_flags[@]}" --numeric-owner -C "$stage" .
          rm -rf "$stage"
          echo "Packed $(tar -tzf release.tar.gz | grep -cv '/$') files for the server."
      # The end-to-end test points the same command at its throwaway server. With secrets-from-environment the values
      # are the secrets the *-secret inputs name, as the job's environment holds them.
      - name: Send the release to the server
        env:
          SSH_HOST: ${{ inputs.e2e && steps.e2e-server.outputs.host || inputs.secrets-from-environment && secrets[inputs.ssh-host-secret] || secrets.ssh-host }}
          SSH_USER: ${{ inputs.e2e && steps.e2e-server.outputs.user || inputs.secrets-from-environment && secrets[inputs.ssh-user-secret] || secrets.ssh-user }}
          SSH_PRIVATE_KEY: ${{ inputs.e2e && steps.e2e-server.outputs.private-key || inputs.secrets-from-environment && secrets[inputs.ssh-private-key-secret] || secrets.ssh-private-key }}
          SSH_KNOWN_HOSTS: ${{ inputs.e2e && steps.e2e-server.outputs.known-hosts || inputs.secrets-from-environment && secrets[inputs.ssh-known-hosts-secret] || secrets.ssh-known-hosts }}
          SSH_PORT: ${{ inputs.ssh-port }}
          REMOTE_COMMAND: ${{ inputs.remote-command }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then echo "::error::ssh-host is not a host name or address."; exit 1; fi
          if [[ ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then echo "::error::ssh-user is not a user name."; exit 1; fi
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/deploy_known_hosts"
          (
            umask 077
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          )
          # The server prints `step|…` lines and ends with `result|ok` (init's deploy.sh, DF-9): an exit status alone
          # could come from a session cut halfway, so only that line counts as a release.
          output="$RUNNER_TEMP/deploy-output.txt"
          set -o pipefail
          ssh -i "$key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND $TAG" < release.tar.gz | tee "$output"
          if ! grep -qx 'result|ok' "$output"; then
            echo "::error::The server did not report result|ok; the release is not confirmed (see the lines above)."
            exit 1
          fi
      # The server's step and result lines for the release report (DF-10): step names, the backup's file name and row
      # counts, never a value of .env.prod. Every kept line starts with step| or result|, so none can end the heredoc.
      - id: server-lines
        name: Keep the server's step lines
        if: always()
        run: |
          {
            echo "lines<<SERVER_LINES"
            grep -E '^(step|result)\|' "$RUNNER_TEMP/deploy-output.txt" 2> /dev/null || true
            echo "SERVER_LINES"
          } >> "$GITHUB_OUTPUT"
      # What the end-to-end server recorded: names, hashes and the command line, never a value of .env.prod.
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-e2e-received
          path: ${{ runner.temp }}/e2e-server/received/
          if-no-files-found: error
          retention-days: 7
      # The verify job's two steps, here because the end-to-end stack runs on this runner; keep them in step with it.
      # The runner trusts the run's CA (curl); Node takes it from NODE_EXTRA_CA_CERTS.
      - name: Wait for the health route (end-to-end test)
        if: inputs.e2e
        env:
          APP_URL: ${{ inputs.app-url }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
        run: |
          url="${APP_URL%/}$HEALTH_PATH"
          deadline=$((SECONDS + VERIFY_TIMEOUT))
          while true; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$status" = "200" ]; then
              echo "verify: $url answered 200."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::verify: $url did not answer 200 within ${VERIFY_TIMEOUT}s (last: ${status:-no answer})."
              exit 1
            fi
            echo "verify: $url answered ${status:-nothing}; retrying in 10s."
            sleep 10
          done
      - name: Verify the routes in deploy.json (end-to-end test)
        if: inputs.e2e && inputs.deploy-config != ''
        env:
          APP_URL: ${{ inputs.app-url }}
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
          NODE_EXTRA_CA_CERTS: ${{ steps.e2e-server.outputs.ca-file }}
        run: node .softure-ai-cli/tools/deploy/dist/cli/main.js verify "$APP_URL" --config="$DEPLOY_CONFIG"
      - name: Show the server's log and the stack (end-to-end test)
        if: always() && inputs.e2e
        run: |
          sudo cat "$RUNNER_TEMP/e2e-server/server/sshd.log" || true
          docker ps --all || true
          for container in $(docker ps --all --quiet --filter label=com.docker.compose.project); do
            echo "::group::docker logs $container"
            docker logs --tail 200 "$container" || true
            echo "::endgroup::"
          done
      - name: Remove the key, .env.prod and the release archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts" "$RUNNER_TEMP/release" "$RUNNER_TEMP/e2e-server" "$RUNNER_TEMP/e2e-image" "$RUNNER_TEMP/deploy-output.txt" .env.prod release.tar.gz

  verify:
    name: verify the release
    needs: deploy
    # The end-to-end test's stack runs on the deploy job's runner, so that job runs these steps itself.
    if: ${{ !inputs.e2e }}
    # In the environment only to read the secret verify-env-secret names (the check job allows it only with
    # secrets-from-environment); otherwise outside it, so a protected environment is not asked twice.
    environment: ${{ inputs.verify-env-secret != '' && inputs.environment || '' }}
    runs-on: ubuntu-latest
    # Above the longest verify-timeout-seconds the check job accepts (9999 s).
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Wait for the health route
        env:
          APP_URL: ${{ inputs.app-url }}
          HEALTH_PATH: ${{ inputs.health-path }}
          VERIFY_TIMEOUT: ${{ inputs.verify-timeout-seconds }}
        run: |
          url="${APP_URL%/}$HEALTH_PATH"
          deadline=$((SECONDS + VERIFY_TIMEOUT))
          while true; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$status" = "200" ]; then
              echo "verify: $url answered 200."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::verify: $url did not answer 200 within ${VERIFY_TIMEOUT}s (last: ${status:-no answer})."
              exit 1
            fi
            echo "verify: $url answered ${status:-nothing}; retrying in 10s."
            sleep 10
          done
      # Only the config file is fetched (the leading / anchors it to the root), so no .npmrc or package.json of the
      # app steers npx. A missing or invalid file fails here with the CLI's message; it is never skipped silently.
      - if: inputs.deploy-config != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: /${{ inputs.deploy-config }}
          sparse-checkout-cone-mode: false
      - if: inputs.deploy-config != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Verify the routes in deploy.json
        if: inputs.deploy-config != ''
        env:
          APP_URL: ${{ inputs.app-url }}
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          ORIGIN_ADDRESS: ${{ secrets.origin-address }}
          ORIGIN_ADDRESS_VAR: ${{ inputs.origin-address-var }}
          APP_VARS: ${{ inputs.app-vars }}
          # The secret verify-env, or the one verify-env-secret names: a JSON object of variables for the CLI only.
          VERIFY_ENV: ${{ inputs.verify-env-secret != '' && secrets[inputs.verify-env-secret] || secrets.verify-env }}
          VERIFY_ENV_SECRET: ${{ inputs.verify-env-secret }}
          VERIFY_ENV_RULES: >-
            if type != "object" or any(.[]; type != "string") then "a JSON object of text values by name"
            else keys_unsorted[]
              | if test("^[A-Za-z_][A-Za-z0-9_]*$") | not then "\(.) is not a name (letters, digits, _)"
                elif ascii_upcase | test("^(APP_URL|DEPLOY_CONFIG|DEPLOY_CLI_VERSION|ORIGIN_ADDRESS|ORIGIN_ADDRESS_VAR|APP_VARS|VERIFY_ENV|VERIFY_ENV_SECRET|VERIFY_ENV_RULES|PATH|HOME|NODE_.*|NPM_CONFIG_.*)$")
                then "\(.) is reserved for the verify step or the runner"
                else empty end
            end
        run: |
          # The check job made sure the app-vars entry exists, holds an address and never comes with the secret.
          if [ -n "${ORIGIN_ADDRESS_VAR:-}" ]; then
            ORIGIN_ADDRESS="$(printf '%s' "$APP_VARS" | jq -r --arg name "$ORIGIN_ADDRESS_VAR" '.[$name]')"
          fi
          origin=()
          if [ -n "$ORIGIN_ADDRESS" ]; then origin=("--origin=$ORIGIN_ADDRESS"); fi
          variables=()
          if [ -n "${VERIFY_ENV_SECRET:-}" ] && [ -z "${VERIFY_ENV:-}" ]; then
            echo "::error::verify-env-secret: the environment (or the repository) has no secret $VERIFY_ENV_SECRET."
            exit 1
          fi
          if [ -n "${VERIFY_ENV:-}" ]; then
            input="${VERIFY_ENV_SECRET:-verify-env}"
            # An entry of a JSON secret is not masked on its own, so every line of every value is, before anything else.
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done < <(printf '%s' "$VERIFY_ENV" | jq -r '.[]? | strings' 2> /dev/null || true)
            problems="$(printf '%s' "$VERIFY_ENV" | jq -r "$VERIFY_ENV_RULES" 2> /dev/null || echo "a JSON object of text values by name")"
            if [ -n "$problems" ]; then
              while IFS= read -r problem; do echo "::error::$input is not valid: $problem"; done <<< "$problems"
              exit 1
            fi
            # The trailing x keeps a value's last new lines through $(...).
            while IFS= read -r name; do
              value="$(printf '%s' "$VERIFY_ENV" | jq -j --arg name "$name" '.[$name]'; printf x)"
              variables+=("$name=${value%x}")
            done < <(printf '%s' "$VERIFY_ENV" | jq -r 'keys_unsorted[]')
          fi
          env -u VERIFY_ENV "${variables[@]}" npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy verify "$APP_URL" --config="$DEPLOY_CONFIG" "${origin[@]}"

  # The facts of this run for the release report (deploy-report.yml, DF-10), whatever happened: each job's result, the
  # image and its digest, and the server's step lines. It writes nothing anywhere but the run's artifact
  # `deploy-report`; a re-run of failed jobs replaces it.
  summary:
    name: summarize the run
    needs: [check, build, deploy, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write deploy-report.json
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SERVER_LINES: ${{ needs.deploy.outputs.server-lines }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-report"
          jq -n \
            --arg tag "$TAG" --arg environment "$DEPLOY_ENVIRONMENT" --arg image "$IMAGE" --arg digest "$DIGEST" \
            --arg runUrl "$RUN_URL" --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg check "$CHECK_RESULT" --arg build "$BUILD_RESULT" --arg deploy "$DEPLOY_RESULT" --arg verify "$VERIFY_RESULT" \
            --arg lines "$SERVER_LINES" \
            '{version: 1, tag: $tag, environment: $environment, image: $image, digest: $digest, runUrl: $runUrl,
              finishedAt: $finishedAt,
              jobs: [{name: "check", result: $check}, {name: "build", result: $build},
                     {name: "deploy", result: $deploy}, {name: "verify", result: $verify}],
              serverLines: ($lines | split("\n") | map(select(length > 0)))}' \
            > "$RUNNER_TEMP/deploy-report/deploy-report.json"
          cat "$RUNNER_TEMP/deploy-report/deploy-report.json"
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-report
          path: ${{ runner.temp }}/deploy-report/deploy-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
