# Cancels the run that calls it (@softure-ai/deploy, issue #628): the fail-fast step of a release pipeline. A part of
# the pipeline that failed (the preflight, the static checks, the unit shards, the image) makes the rest of the run
# worthless, yet every other job keeps running and is billed until it ends. A watcher job per part calls this one:
#
#   stop-on-image:
#     needs: image
#     if: failure()
#     permissions:
#       actions: write
#     uses: SOFTURE/AI/.github/workflows/deploy-cancel-run.yml@<sha>
#
# One watcher per part, because a job that needs several waits for the slowest of them. Only parts that run before the
# deploy are watched, so a running deploy is never cancelled halfway. A workflow of its own so that `actions: write`
# stays out of every other workflow: deploy-release-checks.yml is also called by pull requests, whose caller grants
# `contents: read` only. The caller is `tools/deploy/examples/deploy-pipeline.yml`; README, "Fail fast".

name: deploy-cancel-run

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner of every job as JSON, one label or an array of labels (e.g. "ubuntu-latest" or ["self-hosted","linux"])
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  cancel:
    name: cancel the run
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    # Cancelling a run of the repository.
    permissions:
      actions: write
    steps:
      - name: Check the runner
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # GitHub picked this runner from the value already, so a value that is not JSON never gets here; this step
        # refuses the JSON that GitHub takes but the input does not mean (an object, an empty array, a number).
        run: |
          label='"[^"\\]+"'
          space='[[:space:]]*'
          pattern="^$space($label|\\[$space$label($space,$space$label)*$space\\])$space\$"
          if [[ ! "$RUNS_ON" =~ $pattern ]]; then
            echo "::error::Input runs-on is not valid: a JSON label such as '\"ubuntu-latest\"' or a non-empty array of labels such as '[\"self-hosted\",\"linux\"]'"
            exit 1
          fi

      # Two watchers can fire for one failure (failure() also sees a failed ancestor), and the second finds the run
      # cancelled already: a refusal is a warning, since the run is red either way.
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "A part of the release failed, so nothing else in it can matter: cancelling run $RUN_ID."
          if ! gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/cancel" > /dev/null; then
            echo "::warning::The runs API did not cancel run $RUN_ID (cancelled already?); its other jobs run to their end."
          fi
