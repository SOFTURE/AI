# The CI minutes report (@softure-ai/ci-usage, issue #1360): a reusable workflow an app calls with a few lines
# (tools/ci-usage/examples/ci-usage.yml) on a weekly schedule and on demand. One job, no checkout:
#
# - `report` reads the finished workflow runs of the last `days` days through the Actions API, one UTC day at a time,
#   and writes ci-usage.json and ci-usage.md: billable minutes (each job rounded up to a whole minute, reruns included)
#   and the estimated USD per repository, workflow and job, on GitHub-hosted, Ubicloud and other runners. It reads with
#   the secret CI_USAGE_TOKEN when the caller passes one (several repositories, the billing lookup), else with the
#   caller's GITHUB_TOKEN (`actions: read`, this repository only). A cache of finished runs (actions/cache) lets a
#   repeated report read only the new runs; a report that hits the rate limit or the time budget (`max-minutes`,
#   below the job's 15-minute timeout) is marked partial, never failed, and its cache lets the next run go further.
# - `publish` keeps one issue labelled `ci-usage` in the calling repository up to date (the body is the latest report,
#   with the JSON in a collapsed block) and comments each run's totals. It always writes with GITHUB_TOKEN
#   (`issues: write`). Agents read that issue with the GitHub tools they already have.
#
# The report also goes to the job summary and the artifact `ci-usage-report`. The CLI comes from npm at the exact
# version of `cli-version`.

name: ci-usage

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner of every job as JSON, one label or an array of labels (e.g. "ubuntu-latest" or ["self-hosted","linux"])
        type: string
        default: '"ubuntu-latest"'
      repositories:
        description: The repositories to report on, owner/name, comma or space separated; empty means the calling repository
        type: string
        default: ""
      days:
        description: Length of the period in days, ending now (1 to 31)
        type: string
        default: "7"
      prices:
        description: 'JSON object of runner label to USD per minute, over the built-in GitHub and Ubicloud prices (e.g. {"my-runner":0.004})'
        type: string
        default: ""
      ubicloud-premium:
        description: Price every Ubicloud minute as a premium runner (an account setting the job does not show)
        type: boolean
        default: false
      billing:
        description: Add what GitHub billed, org:<organization> or user:<user>; needs CI_USAGE_TOKEN with organization "Administration" or user "Plan" read access
        type: string
        default: ""
      max-minutes:
        description: Minutes the report may spend reading runs before it stops and is marked partial (1 to 14, below the job timeout)
        type: string
        default: "10"
      publish:
        description: Keep the ci-usage issue of the calling repository up to date
        type: boolean
        default: true
      cli-version:
        description: Version of @softure-ai/ci-usage that writes the report
        type: string
        default: 0.1.2
      node-version:
        description: Node.js version that runs the CLI
        type: string
        default: "22"
    secrets:
      CI_USAGE_TOKEN:
        description: 'Optional fine-grained token with "Actions: read" on every listed repository (and billing read access for the billing input)'
        required: false

permissions:
  contents: read

concurrency:
  group: ci-usage-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    name: report the CI minutes
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check the runner
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # GitHub picked this runner from the value already, so a value that is not JSON never gets here; this step
        # refuses the JSON that GitHub takes but the input does not mean (an object, an empty array, a number).
        run: |
          label='"[^"\\]+"'
          space='[[:space:]]*'
          pattern="^$space($label|\\[$space$label($space,$space$label)*$space\\])$space\$"
          if [[ ! "$RUNS_ON" =~ $pattern ]]; then
            echo "::error::Input runs-on is not valid: a JSON label such as '\"ubuntu-latest\"' or a non-empty array of labels such as '[\"self-hosted\",\"linux\"]'"
            exit 1
          fi
      - name: Check the inputs
        env:
          REPOSITORIES: ${{ inputs.repositories }}
          DAYS: ${{ inputs.days }}
          MAX_MINUTES: ${{ inputs.max-minutes }}
          BILLING: ${{ inputs.billing }}
          CLI_VERSION: ${{ inputs.cli-version }}
        # The prices JSON is checked by the CLI itself, which names what is wrong.
        run: |
          failures=0
          reject() { echo "::error::Input $1 is not valid: $2"; failures=$((failures + 1)); }
          if [[ ! "$REPOSITORIES" =~ ^[A-Za-z0-9_./,[:space:]-]*$ ]]; then reject repositories "owner/name entries separated by commas or spaces, or empty"; fi
          if [[ ! "$DAYS" =~ ^[0-9]+$ ]] || (( DAYS < 1 || DAYS > 31 )); then reject days "a whole number from 1 to 31"; fi
          if [[ ! "$MAX_MINUTES" =~ ^[0-9]+$ ]] || (( MAX_MINUTES < 1 || MAX_MINUTES > 14 )); then reject max-minutes "a whole number from 1 to 14"; fi
          if [ -n "$BILLING" ] && [[ ! "$BILLING" =~ ^(org|user):[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then reject billing "org:<organization>, user:<user> or empty"; fi
          if [[ ! "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then reject cli-version "an exact version"; fi
          if (( failures > 0 )); then exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install the CLI
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p ci-usage
          cd ci-usage
          printf '{"private":true}\n' > package.json
          npm install --no-audit --no-fund --save-exact "@softure-ai/ci-usage@$CLI_VERSION"
      # Finished runs never change, so the cache of the last report saves their requests; a lost cache costs requests,
      # never a wrong number. A new key every run, restored from the newest earlier one.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ci-usage-cache
          key: ci-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-usage-
      - name: Report
        env:
          GITHUB_TOKEN: ${{ secrets.CI_USAGE_TOKEN || github.token }}
          REPOSITORIES: ${{ inputs.repositories }}
          DAYS: ${{ inputs.days }}
          MAX_MINUTES: ${{ inputs.max-minutes }}
          PRICES: ${{ inputs.prices }}
          PREMIUM: ${{ inputs.ubicloud-premium }}
          BILLING: ${{ inputs.billing }}
        run: |
          set -euo pipefail
          premium=()
          if [ "$PREMIUM" = true ]; then premium=(--ubicloud-premium); fi
          "$RUNNER_TEMP/ci-usage/node_modules/.bin/softure-ci-usage" report --repository "$REPOSITORIES" --days "$DAYS" \
            --max-minutes "$MAX_MINUTES" --prices "$PRICES" --billing "$BILLING" "${premium[@]}" \
            --out-dir "$RUNNER_TEMP/ci-usage-report" --cache "$RUNNER_TEMP/ci-usage-cache/runs.json"
          cat "$RUNNER_TEMP/ci-usage-report/ci-usage.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-usage-report
          path: ${{ runner.temp }}/ci-usage-report
          if-no-files-found: error
          retention-days: 90
      - name: Publish the issue
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/ci-usage/node_modules/.bin/softure-ci-usage" publish --report-dir "$RUNNER_TEMP/ci-usage-report"
