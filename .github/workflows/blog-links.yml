# The blog quality gate with the network (@softure-ai/blog, BL-6): a reusable workflow an app calls
# on a weekly schedule. Source links (laws, statistics offices, fact sheets) move, and a text
# published once lives for years; `npm test` and publishing never depend on other people's servers,
# so dead links are found here. A red run means a text to fix and publish again.
#
# In the app, `.github/workflows/blog-links.yml`:
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"   # Mondays 6:00 UTC
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     links:
#       uses: SOFTURE/AI/.github/workflows/blog-links.yml@master
#       # with:
#       #   sparse-checkout: |      # optional: skip heavy folders the gate never reads
#       #     /*
#       #     !/context/archive/
#
# The app's config must load in Node (softure.config.mjs or .js), or `command` names an app script
# that calls runBlogCli. `check` never connects to the database, so the job sets no DATABASE_URL: the
# bin loads the config with the database optional, and a missing or empty URL loads as no database.

name: blog-links

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version of the app
        type: string
        default: "22"
      working-directory:
        description: The app's folder in its repository
        type: string
        default: "."
      command:
        description: The gate with external links
        type: string
        default: "npx softure-blog check --external"
      sparse-checkout:
        description: "Checkout patterns, non-cone (e.g. /* and !/context/archive/); empty = the whole repository"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  links:
    name: blog gate + external links
    runs-on: ubuntu-latest
    # A link check that hangs on a dead server must not hold a runner for the default six hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # Any lock file in the checkout: the app's own, or the root one of a workspace.
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      # Through the environment, not interpolated into the script.
      - name: Gate with external links
        env:
          GATE_COMMAND: ${{ inputs.command }}
        run: bash -c "$GATE_COMMAND"
