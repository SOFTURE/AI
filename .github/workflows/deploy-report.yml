# The deploy run's report in the GitHub Release of the tag (@softure-ai/deploy, DF-10): a reusable workflow the app's
# caller runs as a second job after deploy-app.yml, `if: always()`. It reads the artifact `deploy-report` that
# deploy-app.yml's `summary` job uploaded in the same run (each job's result, the image, the digest and the server's
# step lines) and writes, with `softure-deploy release-report`, the pipeline status (replaced) and a deployment row
# (newest first, earlier rows kept) into the release body. The owner's text and the release-notes section stay.
#
# It is a workflow of its own because it needs `contents: write` to edit the release: a job of deploy-app.yml could
# only have it if the caller granted it to the build, deploy and verify jobs too. The caller grants it to this job only.
#
# A tag without a release (a deploy started by hand) gets no report. A failed report never turns the run red
# (continue-on-error), except on this repository's own end-to-end test, where it must.
#
# `e2e: true` is SOFTURE/AI's own end-to-end test (e2e-deploy.yml) and is refused in any other repository: the CLI is
# built from the tag, a fixture body stands in for the release, and the new body is uploaded as the artifact
# `deploy-report-body` instead of being written to a release.

name: deploy-report

on:
  workflow_call:
    inputs:
      tag:
        description: The deployed tag, whose GitHub Release gets the report
        type: string
        required: true
      locale:
        description: Language of the report (en or pl)
        type: string
        default: en
      deploy-cli-version:
        description: Version of @softure-ai/deploy that writes the report
        type: string
        default: 0.1.4
      node-version:
        description: Node.js version that runs the deploy CLI
        type: string
        default: "22"
      e2e:
        description: SOFTURE/AI's own end-to-end test only (e2e-deploy.yml); refused in any other repository
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    name: write the report into the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    continue-on-error: ${{ !inputs.e2e }}
    # One writer per release at a time, so two runs on one tag never drop each other's row. End-to-end runs write no
    # release, so each has its own group.
    concurrency:
      group: deploy-report-${{ github.repository }}-${{ inputs.tag }}${{ inputs.e2e && format('-e2e-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          LOCALE: ${{ inputs.locale }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          E2E: ${{ inputs.e2e }}
          REPOSITORY: ${{ github.repository }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then reject tag "a Docker tag (letters, digits, _ . -; at most 128)"; fi
          if [[ ! "$LOCALE" =~ ^(en|pl)$ ]]; then reject locale "en or pl"; fi
          if [[ ! "$DEPLOY_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then reject deploy-cli-version "an exact version"; fi
          if [ "$E2E" = "true" ] && [ "$REPOSITORY" != "SOFTURE/AI" ]; then
            reject e2e "false outside SOFTURE/AI (it is that repository's own end-to-end test)"
          fi
          if (( failures > 0 )); then exit 1; fi
      - uses: actions/download-artifact@v8
        with:
          name: deploy-report
          path: ${{ runner.temp }}/deploy-report
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      # End-to-end test only (refused outside SOFTURE/AI above): the CLI of the tag itself.
      - if: inputs.e2e
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          path: .softure-ai-cli
      - name: Build the deploy CLI from the tag (end-to-end test)
        if: inputs.e2e
        working-directory: .softure-ai-cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - id: body
        name: Read the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          E2E: ${{ inputs.e2e }}
        run: |
          body="$RUNNER_TEMP/release-body.md"
          if [ "$E2E" = "true" ]; then
            printf 'Release text written by the owner.\n' > "$body"
          elif ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$body" 2> "$RUNNER_TEMP/gh-error"; then
            # Only a missing release is expected; any other error (token, network) fails the report.
            if grep -q "release not found" "$RUNNER_TEMP/gh-error"; then
              echo "::notice::No GitHub Release for $TAG; the report is not written."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/gh-error" >&2
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Write the report
        if: steps.body.outputs.found == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          # Set on the end-to-end test only: the CLI built from the tag above instead of the published one.
          DEPLOY_CLI: ${{ inputs.e2e && format('{0}/.softure-ai-cli/tools/deploy/dist/cli/main.js', github.workspace) || '' }}
        run: |
          args=(release-report "--body=$RUNNER_TEMP/release-body.md" "--summary=$RUNNER_TEMP/deploy-report/deploy-report.json"
            "--locale=$LOCALE" "--out=$RUNNER_TEMP/release-body.md")
          if [ -n "$DEPLOY_CLI" ]; then
            node "$DEPLOY_CLI" "${args[@]}"
          else
            npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy "${args[@]}"
          fi
      - name: Update the release
        if: steps.body.outputs.found == 'true' && !inputs.e2e
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-body.md"
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-report-body
          path: ${{ runner.temp }}/release-body.md
          if-no-files-found: error
          retention-days: 7
