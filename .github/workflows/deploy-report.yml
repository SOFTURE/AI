# The deploy run's report in the GitHub Release of the tag (@softure-ai/deploy, DF-10): a reusable workflow the app's
# caller runs as a second job after deploy-app.yml, `if: always()`. It reads the artifact `deploy-report` that
# deploy-app.yml's `summary` job uploaded in the same run (each job's result, the image, the digest and the server's
# step lines) and writes, with `softure-deploy release-report`, the pipeline status (replaced) and a deployment row
# (newest first, earlier rows kept) into the release body. The owner's text and the release-notes section stay.
#
# It is a workflow of its own because it needs `contents: write` to edit the release: a job of deploy-app.yml could
# only have it if the caller granted it to the build, deploy and verify jobs too. The caller grants it to this job only.
#
# A tag without a release (a deploy started by hand) gets no report. A failed report never turns the run red
# (continue-on-error), except on this repository's own end-to-end test, where it must.
#
# `e2e: true` is SOFTURE/AI's own end-to-end test (e2e-deploy.yml) and is refused in any other repository: the CLI is
# built from the tag, a fixture body stands in for the release, and the new body is uploaded as the artifact
# `deploy-report-body` instead of being written to a release.

name: deploy-report

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner of every job as JSON, one label or an array of labels (e.g. "ubuntu-latest" or ["self-hosted","linux"])
        type: string
        default: '"ubuntu-latest"'
      tag:
        description: The deployed tag, whose GitHub Release gets the report
        type: string
        required: true
      locale:
        description: Language of the report (en, the only built-in language)
        type: string
        default: en
      deploy-cli-version:
        description: Version of @softure-ai/deploy that writes the report
        type: string
        default: 0.4.7
      node-version:
        description: Node.js version that runs the deploy CLI
        type: string
        default: "22"
      e2e:
        description: SOFTURE/AI's own end-to-end test only (e2e-deploy.yml); refused in any other repository
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    name: write the report into the release
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write
    continue-on-error: ${{ !inputs.e2e }}
    # One writer per release at a time, so two runs on one tag never drop each other's row. End-to-end runs write no
    # release, so each has its own group.
    concurrency:
      group: deploy-report-${{ github.repository }}-${{ inputs.tag }}${{ inputs.e2e && format('-e2e-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      - name: Check the runner
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # GitHub picked this runner from the value already, so a value that is not JSON never gets here; this step
        # refuses the JSON that GitHub takes but the input does not mean (an object, an empty array, a number).
        run: |
          label='"[^"\\]+"'
          space='[[:space:]]*'
          pattern="^$space($label|\\[$space$label($space,$space$label)*$space\\])$space\$"
          if [[ ! "$RUNS_ON" =~ $pattern ]]; then
            echo "::error::Input runs-on is not valid: a JSON label such as '\"ubuntu-latest\"' or a non-empty array of labels such as '[\"self-hosted\",\"linux\"]'"
            exit 1
          fi
      # A self-hosted runner keeps one work directory per repository between jobs, and a sparse checkout an earlier job
      # left there outlives the next full one (issue #687): every job that checks out starts from an empty workspace,
      # as on a hosted runner.
      - name: Empty the workspace
        # Outside the workspace, and before a job's defaults.run.working-directory (inside the checkout) exists.
        working-directory: ${{ runner.temp }}
        run: |
          if ! find "${GITHUB_WORKSPACE:?}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
            echo "::error::The workspace $GITHUB_WORKSPACE could not be emptied: files of another user (a container's volume) are left there. Remove them on the runner, and empty the workspace in its job-started hook (@softure-ai/deploy README, \"Runner\")."
            exit 1
          fi

      # GitHub's hosted images ship the GitHub CLI, a self-hosted runner may not (issue #686): without it, this installs
      # a pinned copy into RUNNER_TEMP for this job only, checked against its SHA-256 first, with no sudo.
      - name: Set up the GitHub CLI
        run: |
          if command -v gh > /dev/null; then
            exit 0
          fi
          version=2.103.0
          case "$RUNNER_OS $RUNNER_ARCH" in
            "Linux X64") arch=amd64 sum=fdd768eb70f6409f80fcfa9f3a1c0adf0fc98d827ab3ce0bed2ac22762c5d786 ;;
            "Linux ARM64") arch=arm64 sum=7f322df34e624d14f5ec0c4acb121fd6dfa14392fdbbd1066aa8e0a05ac3721e ;;
            *)
              echo "::error::The GitHub CLI (gh) is not on this runner and cannot be installed on $RUNNER_OS $RUNNER_ARCH: install gh on the runner (https://cli.github.com)"
              exit 1
              ;;
          esac
          missing=""
          for tool in curl tar; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::The GitHub CLI (gh) is not on this runner, and installing it needs:$missing"
            exit 1
          fi
          name="gh_${version}_linux_$arch"
          url="https://github.com/cli/cli/releases/download/v$version/$name.tar.gz"
          dir="$RUNNER_TEMP/gh-$version"
          archive="$dir/$name.tar.gz"
          rm -rf "$dir"
          mkdir -p "$dir"
          if ! curl -fsSL --retry 3 -o "$archive" "$url"; then
            echo "::error::Downloading the GitHub CLI failed: $url"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            actual="$(sha256sum "$archive" | cut -d " " -f 1)"
          else
            actual="$(shasum -a 256 "$archive" | cut -d " " -f 1)"
          fi
          if [ "$actual" != "$sum" ]; then
            echo "::error::The GitHub CLI archive $name.tar.gz does not match its pinned SHA-256 ($actual, expected $sum)"
            rm -rf "$dir"
            exit 1
          fi
          tar -xzf "$archive" -C "$dir"
          rm -f "$archive"
          "$dir/$name/bin/gh" --version
          echo "$dir/$name/bin" >> "$GITHUB_PATH"

      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          LOCALE: ${{ inputs.locale }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          E2E: ${{ inputs.e2e }}
          REPOSITORY: ${{ github.repository }}
        run: |
          failures=0
          reject() {
            echo "::error::Input $1 is not valid: $2"
            failures=$((failures + 1))
          }
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then reject tag "a Docker tag (letters, digits, _ . -; at most 128)"; fi
          if [ "$LOCALE" != "en" ]; then reject locale "en (the report is English only)"; fi
          if [[ ! "$DEPLOY_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then reject deploy-cli-version "an exact version"; fi
          if [ "$E2E" = "true" ] && [ "$REPOSITORY" != "SOFTURE/AI" ]; then
            reject e2e "false outside SOFTURE/AI (it is that repository's own end-to-end test)"
          fi
          if (( failures > 0 )); then exit 1; fi
      - uses: actions/download-artifact@v8
        with:
          name: deploy-report
          path: ${{ runner.temp }}/deploy-report
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      # End-to-end test only (refused outside SOFTURE/AI above): the CLI of the tag itself.
      - if: inputs.e2e
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          path: .softure-ai-cli
      - name: Build the deploy CLI from the tag (end-to-end test)
        if: inputs.e2e
        working-directory: .softure-ai-cli
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - id: body
        name: Read the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          E2E: ${{ inputs.e2e }}
        run: |
          body="$RUNNER_TEMP/release-body.md"
          if [ "$E2E" = "true" ]; then
            printf 'Release text written by the owner.\n' > "$body"
          elif ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$body" 2> "$RUNNER_TEMP/gh-error"; then
            # Only a missing release is expected; any other error (token, network) fails the report.
            if grep -q "release not found" "$RUNNER_TEMP/gh-error"; then
              echo "::notice::No GitHub Release for $TAG; the report is not written."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/gh-error" >&2
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Write the report
        if: steps.body.outputs.found == 'true'
        env:
          LOCALE: ${{ inputs.locale }}
          DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
          # Set on the end-to-end test only: the CLI built from the tag above instead of the published one.
          DEPLOY_CLI: ${{ inputs.e2e && format('{0}/.softure-ai-cli/tools/deploy/dist/cli/main.js', github.workspace) || '' }}
        run: |
          args=(release-report "--body=$RUNNER_TEMP/release-body.md" "--summary=$RUNNER_TEMP/deploy-report/deploy-report.json"
            "--locale=$LOCALE" "--out=$RUNNER_TEMP/release-body.md")
          if [ -n "$DEPLOY_CLI" ]; then
            node "$DEPLOY_CLI" "${args[@]}"
          else
            npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy "${args[@]}"
          fi
      - name: Update the release
        if: steps.body.outputs.found == 'true' && !inputs.e2e
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-body.md"
      - if: inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: deploy-report-body
          path: ${{ runner.temp }}/release-body.md
          if-no-files-found: error
          retention-days: 7
