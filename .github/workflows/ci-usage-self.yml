# SOFTURE/AI's own CI minutes report (@softure-ai/ci-usage): every Monday after the weekly macOS run, and by hand.
# It installs the published CLI, so it never runs on a push or a pull request.
name: ci-usage-self

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Length of the period in days, ending now (1 to 31)
        type: string
        default: "7"

permissions: {}

jobs:
  ci-usage:
    uses: ./.github/workflows/ci-usage.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      days: ${{ inputs.days || '7' }}
    secrets:
      CI_USAGE_TOKEN: ${{ secrets.CI_USAGE_TOKEN }}
