# The Cloudflare host of @softure-ai/deploy (RP-8) as one composite action, the counterpart of .github/actions/deploy
# for an app generated by `softure-deploy init --host=cloudflare`: check the inputs and the tag, build with OpenNext,
# migrate the database from the runner, deploy the Worker with its secrets as one version, verify it against
# deploy.json, roll back to the previous version when verify fails, and write the run's `deploy-report` artifact, which
# deploy-report.yml turns into the release report as on a VPS.
#
# The app's job checks out the tag (fetch-depth 0, so the release branch is known), installs its dependencies and runs
# this action from a job that declares `environment:`, on GitHub's runner. Its secrets reach the action by name: each
# one in the step's `env:` and listed in `secret-names`, never the whole secrets context (CodeQL
# excessive-secrets-exposure). They go to wrangler in one JSON file under RUNNER_TEMP (mode 600), removed in every
# case. Every value reaches a script through `env:`, never interpolated into it.
#
# A rollback deploys the version before this one (`wrangler rollback`), code and secrets together, since both were
# uploaded as one version (`wrangler deploy --secrets-file`). The database is not rolled back: migrations move forward
# only, so a release must run on the schema of the one before it.

name: softure-deploy-cloudflare
description: Build, migrate, deploy a Cloudflare Worker with its secrets, verify it and roll back on a red verify (@softure-ai/deploy)

inputs:
  tag:
    description: The release tag being deployed; the checked-out commit must be its commit
    required: true
  release-branch:
    description: The branch the tag's commit must be on (github.event.repository.default_branch)
    required: true
  app-url:
    description: The public base URL, https://<host>[:port] (the verify target)
    required: true
  api-token:
    description: A Cloudflare API token that may edit the Worker and its routes
    required: true
  account-id:
    description: The Cloudflare account ID (32 hex characters)
    required: true
  secret-names:
    description: "Names of the Worker's secrets this step's env holds (NAME: secrets.NAME), separated by spaces or newlines"
    default: ""
  migrate-database-url:
    description: The direct Postgres URL of the migrator role, used on the runner only; empty skips the migration
    default: ""
  build-command:
    description: The build, run in the app's folder; empty skips it (the job built already)
    default: npx opennextjs-cloudflare build
  migrate-command:
    description: The migration, run with DATABASE_URL set to migrate-database-url
    default: npx --yes tsx scripts/migrate.ts
  wrangler:
    description: The wrangler command, split on spaces
    default: npx wrangler
  wrangler-env:
    description: A wrangler environment of wrangler.jsonc (--env); empty uses the top level
    default: ""
  deploy-config:
    description: The verify config in the app's repository
    default: deploy.json
  deploy-cli-version:
    description: The @softure-ai/deploy version that verifies
    required: true
  environment:
    description: The environment's name for the report
    default: production
  report:
    description: Upload this deploy's facts as the artifact deploy-report (deploy-report.yml reads it)
    default: "true"

outputs:
  version-id:
    description: The Worker version this run deployed (empty when the deploy did not finish)
    value: ${{ steps.deploy.outputs.version-id }}
  rolled-back:
    description: true when verify failed and the previous version was deployed again
    value: ${{ steps.rollback.outputs.rolled-back || 'false' }}

runs:
  using: composite
  steps:
    - id: check
      name: Check the inputs
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
        APP_URL: ${{ inputs.app-url }}
        API_TOKEN: ${{ inputs.api-token }}
        ACCOUNT_ID: ${{ inputs.account-id }}
        SECRET_NAMES: ${{ inputs.secret-names }}
        WRANGLER_ENV: ${{ inputs.wrangler-env }}
        DEPLOY_CONFIG: ${{ inputs.deploy-config }}
        DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
      run: |
        problems=()
        if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]] || [[ "$TAG" == *..* ]]; then problems+=("tag is not a release tag name"); fi
        if [[ ! "$RELEASE_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]] || [[ "$RELEASE_BRANCH" == *..* ]]; then problems+=("release-branch is not a branch name"); fi
        if [[ ! "$APP_URL" =~ ^https://[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?(:[0-9]{1,5})?$ ]]; then problems+=("app-url is not https://<host>[:port]"); fi
        if [ -z "$API_TOKEN" ]; then problems+=("api-token is empty: set the CLOUDFLARE_API_TOKEN secret in the environment"); fi
        if [[ ! "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then problems+=("account-id is not a Cloudflare account ID (32 hex characters): set the CLOUDFLARE_ACCOUNT_ID variable"); fi
        if [ -n "$WRANGLER_ENV" ] && [[ ! "$WRANGLER_ENV" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then problems+=("wrangler-env is not an environment name"); fi
        if [[ ! "$DEPLOY_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then problems+=("deploy-cli-version is not a version such as 0.7.1"); fi
        if [ ! -f "$DEPLOY_CONFIG" ]; then problems+=("deploy-config: $DEPLOY_CONFIG is not a file of the app"); fi
        seen=" "
        for name in $SECRET_NAMES; do
          if [[ ! "$name" =~ ^[A-Z][A-Z0-9_]*$ ]]; then problems+=("secret-names: $name is not an upper snake case name"); continue; fi
          if [[ "$name" =~ ^(PATH|HOME|CI|NODE_.*|NPM_CONFIG_.*|CLOUDFLARE_.*|WRANGLER_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*|INPUT_.*)$ ]]; then
            problems+=("secret-names: $name is reserved for the runner or wrangler"); continue
          fi
          if [[ "$seen" == *" $name "* ]]; then problems+=("secret-names: $name is listed twice"); continue; fi
          seen="$seen$name "
          if [ -z "${!name:-}" ]; then problems+=("secret-names: $name is empty: pass secrets.$name as $name in the step's env and set the secret in the environment"); fi
        done
        if [ "${#problems[@]}" -gt 0 ]; then
          for problem in "${problems[@]}"; do echo "::error::$problem"; done
          exit 1
        fi
    - id: tag
      name: Check the tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
      run: |
        if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
          echo "::error::The tag $TAG is not in the checkout: check out the tag with fetch-depth 0."
          exit 1
        fi
        head="$(git rev-parse HEAD)"
        if [ "$head" != "$tag_commit" ]; then
          echo "::error::The checkout is $head, not the commit of $TAG ($tag_commit)."
          exit 1
        fi
        if ! git rev-parse --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH" > /dev/null; then
          echo "::error::The branch $RELEASE_BRANCH is not in the checkout: check out with fetch-depth 0."
          exit 1
        fi
        if ! git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/$RELEASE_BRANCH"; then
          echo "::error::The commit of $TAG is not on $RELEASE_BRANCH; only a tag on the release branch deploys."
          exit 1
        fi
        echo "sha=$tag_commit" >> "$GITHUB_OUTPUT"
    - id: build
      name: Build the Worker
      if: inputs.build-command != ''
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: bash -e -c "$BUILD_COMMAND"
    - id: migrate
      name: Migrate the database
      if: inputs.migrate-database-url != ''
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.migrate-database-url }}
        MIGRATE_COMMAND: ${{ inputs.migrate-command }}
      run: bash -e -c "$MIGRATE_COMMAND"
    - id: deploy
      name: Deploy the Worker with its secrets
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        SECRET_NAMES: ${{ inputs.secret-names }}
        WRANGLER: ${{ inputs.wrangler }}
        WRANGLER_ENV: ${{ inputs.wrangler-env }}
        TAG: ${{ inputs.tag }}
        SHA: ${{ steps.tag.outputs.sha }}
      run: |
        read -r -a wrangler <<< "$WRANGLER"
        names=()
        for name in $SECRET_NAMES; do names+=("$name"); done
        secrets_file="$RUNNER_TEMP/cloudflare-secrets.json"
        output_file="$RUNNER_TEMP/wrangler-output.jsonl"
        rm -f "$secrets_file" "$output_file"
        # Only the listed names, read from this step's env; the file is the runner user's alone and removed below.
        (umask 077 && jq -n '[$ARGS.positional[] | {key: ., value: env[.]}] | from_entries' --args ${names[@]+"${names[@]}"} > "$secrets_file")
        args=(deploy --secrets-file "$secrets_file" --message "$TAG ($SHA)")
        if [ -n "$WRANGLER_ENV" ]; then args+=(--env "$WRANGLER_ENV"); fi
        status=0
        WRANGLER_OUTPUT_FILE_PATH="$output_file" "${wrangler[@]}" "${args[@]}" || status=$?
        rm -f "$secrets_file"
        if [ "$status" -ne 0 ]; then
          echo "::error::wrangler deploy failed ($status); the previous version keeps serving."
          exit "$status"
        fi
        version="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$output_file" 2> /dev/null | tail -n 1 || true)"
        echo "version-id=$version" >> "$GITHUB_OUTPUT"
        echo "Deployed $TAG as Worker version ${version:-unknown}."
    - id: verify
      name: Verify the routes in deploy.json
      shell: bash
      env:
        APP_URL: ${{ inputs.app-url }}
        DEPLOY_CONFIG: ${{ inputs.deploy-config }}
        DEPLOY_CLI_VERSION: ${{ inputs.deploy-cli-version }}
      run: npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy verify "$APP_URL" --config="$DEPLOY_CONFIG"
    # Only after a deploy that verified red: a failed deploy left the previous version serving, so there is nothing to
    # roll back. The job stays red either way.
    - id: rollback
      name: Roll back to the previous version
      if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        WRANGLER: ${{ inputs.wrangler }}
        WRANGLER_ENV: ${{ inputs.wrangler-env }}
        TAG: ${{ inputs.tag }}
      run: |
        read -r -a wrangler <<< "$WRANGLER"
        args=(rollback --message "verify failed for $TAG")
        if [ -n "$WRANGLER_ENV" ]; then args+=(--env "$WRANGLER_ENV"); fi
        "${wrangler[@]}" "${args[@]}"
        echo "rolled-back=true" >> "$GITHUB_OUTPUT"
        echo "::error::verify failed for $TAG; the previous Worker version serves again."
        echo "Verify failed for \`$TAG\`; the previous Worker version was deployed again (\`wrangler rollback\`)." >> "$GITHUB_STEP_SUMMARY"
    - name: Write deploy-report.json
      if: always() && inputs.report == 'true'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        VERSION_ID: ${{ steps.deploy.outputs.version-id }}
        RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
        CHECK_RESULT: ${{ steps.check.outcome == 'success' && steps.tag.outcome == 'success' && 'success' || 'failure' }}
        BUILD_RESULT: ${{ steps.check.outcome != 'success' && 'skipped' || steps.build.outcome == 'failure' && 'failure' || steps.migrate.outcome == 'failure' && 'failure' || steps.deploy.outcome == 'skipped' && 'skipped' || 'success' }}
        DEPLOY_RESULT: ${{ steps.deploy.outcome == 'success' && 'success' || steps.deploy.outcome == 'failure' && 'failure' || 'skipped' }}
        VERIFY_RESULT: ${{ steps.verify.outcome == 'success' && 'success' || steps.verify.outcome == 'failure' && 'failure' || 'skipped' }}
        MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
        ROLLED_BACK: ${{ steps.rollback.outputs.rolled-back }}
      run: |
        lines=()
        if [ "$MIGRATE_OUTCOME" = "success" ]; then lines+=("step|migrate|ok"); fi
        if [ "$DEPLOY_RESULT" = "success" ]; then lines+=("step|deploy|ok|${VERSION_ID:-unknown}"); fi
        if [ "$ROLLED_BACK" = "true" ]; then lines+=("step|rollback|ok" "result|failed|verify")
        elif [ "$MIGRATE_OUTCOME" = "failure" ]; then lines+=("result|failed|migrate")
        elif [ "$DEPLOY_RESULT" = "failure" ]; then lines+=("result|failed|deploy")
        elif [ "$DEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then lines+=("result|ok"); fi
        image=""
        if [ -n "$VERSION_ID" ]; then image="worker@$VERSION_ID"; fi
        mkdir -p "$RUNNER_TEMP/deploy-report"
        jq -n \
          --arg tag "$TAG" --arg environment "$DEPLOY_ENVIRONMENT" --arg image "$image" \
          --arg runUrl "$RUN_URL" --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg check "$CHECK_RESULT" --arg build "$BUILD_RESULT" --arg deploy "$DEPLOY_RESULT" --arg verify "$VERIFY_RESULT" \
          '{version: 1, tag: $tag, environment: $environment, image: $image, digest: "", runUrl: $runUrl,
            finishedAt: $finishedAt,
            jobs: [{name: "check", result: $check}, {name: "build", result: $build},
                   {name: "deploy", result: $deploy}, {name: "verify", result: $verify}],
            serverLines: $ARGS.positional}' \
          --args ${lines[@]+"${lines[@]}"} > "$RUNNER_TEMP/deploy-report/deploy-report.json"
        cat "$RUNNER_TEMP/deploy-report/deploy-report.json"
    - if: always() && inputs.report == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: deploy-report
        path: ${{ runner.temp }}/deploy-report/deploy-report.json
        if-no-files-found: error
        overwrite: true
        retention-days: 30
    - name: Remove the secrets file and wrangler's output
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/cloudflare-secrets.json" "$RUNNER_TEMP/wrangler-output.jsonl" "$RUNNER_TEMP/deploy-report"
