# The deploy steps of @softure-ai/deploy as one composite action: render `.env.prod` from the app's secrets, send the
# release to the server's forced SSH command, verify it, and write the run's `deploy-report` artifact.
#
# Two entry points run it, so there is one implementation:
#
# - deploy-app.yml's own `deploy` and `verify` jobs check out the workflow's commit (job.workflow_sha) and run it with
#   the values they read from their `secrets` context, for a caller in the same organization or one that passes
#   named secrets.
# - An app whose secrets live in GitHub environments, outside the SOFTURE organization (where `secrets: inherit`
#   passes nothing and a `uses:` job cannot name an environment), calls deploy-app.yml with `deploy: false` for the
#   check and the build, then runs this action from a job of its own that declares `environment:`. That job's
#   `secrets` and `vars` contexts hold the environment's values, so production, dev and staging each deploy with their
#   own (tools/deploy/examples/deploy-environments.yml). It passes each secret by name in the step's `env:` and lists
#   the names in `secret-names`, so no step sees the whole secrets context (CodeQL excessive-secrets-exposure).
#
# `release` is deploy-app.yml's `release` output: the check job's validated values as one JSON object, so the check job
# stays the one place that validates them. Every value reaches a script through `env:`, never interpolated into it.
# The app's server files are checked out into `.softure-ai-release/`, so a checkout at the workspace root (the
# workflow's own, or the app's) is left alone.

name: softure-deploy
description: Render .env.prod from the job's secrets, send the release over SSH, verify it and report (@softure-ai/deploy)

inputs:
  release:
    description: deploy-app.yml's `release` output (needs.<job>.outputs.release)
    required: true
  send:
    description: Render .env.prod, pack the release and send it to the server
    default: "true"
  verify:
    description: Wait for the health route, then run softure-deploy verify with deploy.json
    default: "true"
  preflight:
    description: "Check only, before the expensive jobs: the SSH secrets (no connection) and .env.prod rendered from this job's secrets, then deleted. Needs send, verify and report false"
    default: "false"
  report:
    description: Upload this deploy's facts as the artifact deploy-report (deploy-report.yml reads it); false for a second environment in the same run
    default: "true"
  ssh-host:
    description: Server host name or IP address
    default: ""
  ssh-user:
    description: User whose authorized_keys binds the deploy key to the forced command
    default: ""
  ssh-private-key:
    description: Private deploy key, OpenSSH format
    default: ""
  ssh-known-hosts:
    description: known_hosts line(s) of the server
    default: ""
  app-secrets:
    description: JSON object of the app's runtime secrets by name; secret-names is preferred, as a whole secrets context (toJSON(secrets)) exposes every secret to the runner
    default: "{}"
  secret-names:
    description: "Names of the app's runtime secrets this step's env holds (NAME: secrets.NAME), separated by spaces or newlines; instead of app-secrets"
    default: ""
  secrets-context:
    description: app-secrets is a whole secrets context (toJSON(secrets)), so a name reserved for the runner is left out and named instead of refused
    default: "true"
  app-vars:
    description: JSON object of non-secret values by name, e.g. toJSON(vars); rendered over app-secrets
    default: "{}"
  environment:
    description: The environment's name for the report; empty takes deploy-app.yml's environment input
    default: ""
  app-url:
    description: The public base URL of this environment, https://<host>[:port] (the verify target); empty takes deploy-app.yml's app-url input
    default: ""
  origin-address:
    description: The server's own address behind the CDN (IP or host, optional :port); verify fails when it accepts a direct connection. Empty skips the check
    default: ""
  health-status:
    description: The status the health route must answer, e.g. 302 where an access proxy sends every request to its sign-in; the first answer counts, a redirect is not followed
    default: "200"
  health-headers:
    description: "Request headers of the health wait only, one 'Name: value' line each, masked; e.g. an access proxy's service token"
    default: ""
  verify-env:
    description: JSON object of text values by name exported for softure-deploy verify only, masked (e.g. a Web Bot Auth key)
    default: ""
  verify-env-secret:
    description: The secret verify-env was read from, named in its messages; when set, an empty verify-env is refused
    default: ""
  image:
    description: The image reference with its tag, for the report (deploy-app.yml's `image` output)
    default: ""
  digest:
    description: The image digest, for the report (deploy-app.yml's `digest` output)
    default: ""
  check-result:
    description: The check job's result, for the report
    default: success
  build-result:
    description: The build job's result, for the report
    default: success
  deploy-cli:
    description: SOFTURE/AI's end-to-end test only, main.js of the CLI built from the tag instead of the published one
    default: ""
  ca-file:
    description: SOFTURE/AI's end-to-end test only, the CA the verify step trusts (NODE_EXTRA_CA_CERTS)
    default: ""

outputs:
  server-lines:
    description: The server's step and result lines (never a value of .env.prod)
    value: ${{ steps.server-lines.outputs.lines }}

runs:
  using: composite
  steps:
    # One output per value. A multi-line value (build-args, server-files, secret-min-lengths) goes through a heredoc
    # whose delimiter no value holds.
    - id: release
      name: Read the release
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
        APP_URL_INPUT: ${{ inputs.app-url }}
        PREFLIGHT: ${{ inputs.preflight }}
        SEND: ${{ inputs.send }}
        VERIFY: ${{ inputs.verify }}
        REPORT: ${{ inputs.report }}
      run: |
        keys='tag app-url image environment compose-file server-script deploy-config remote-command ssh-port health-path verify-timeout-seconds deploy-cli-version node-version build-args secret-min-lengths registry-token server-files'
        if ! printf '%s' "${RELEASE:-}" | jq -e 'type == "object"' > /dev/null 2>&1; then
          echo "::error::release is not deploy-app.yml's release output (a JSON object)."
          exit 1
        fi
        if [ "${PREFLIGHT:-false}" = "true" ] && { [ "${SEND:-true}" != "false" ] || [ "${VERIFY:-true}" != "false" ] || [ "${REPORT:-true}" != "false" ]; }; then
          echo "::error::Input preflight is not valid: true only with send, verify and report false (a preflight checks, it never deploys)."
          exit 1
        fi
        if [ -n "${APP_URL_INPUT:-}" ] && [[ ! "$APP_URL_INPUT" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]; then
          echo "::error::Input app-url is not valid: https://<host>[:port] with no path"
          exit 1
        fi
        delimiter="RELEASE_VALUE_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        missing=()
        for key in $keys; do
          if ! printf '%s' "$RELEASE" | jq -e --arg key "$key" '.[$key] | type == "string"' > /dev/null; then
            missing+=("$key")
            continue
          fi
          value="$(printf '%s' "$RELEASE" | jq -j --arg key "$key" '.[$key]'; printf x)"
          value="${value%x}"
          if [ "$key" = "app-url" ] && [ -n "${APP_URL_INPUT:-}" ]; then value="$APP_URL_INPUT"; fi
          if [[ "$value" == *"$delimiter"* ]]; then
            echo "::error::release holds the output delimiter in $key."
            exit 1
          fi
          printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_OUTPUT"
        done
        if (( ${#missing[@]} > 0 )); then
          echo "::error::release has no text ${missing[*]}; pass deploy-app.yml's release output unchanged."
          exit 1
        fi
        environment="${ENVIRONMENT_INPUT:-$(printf '%s' "$RELEASE" | jq -r '.environment')}"
        if [[ ! "$environment" =~ ^[A-Za-z0-9_.\ -]{0,255}$ ]]; then
          echo "::error::Input environment is not valid: letters, digits, space, _ . -"
          exit 1
        fi
        echo "report-environment=$environment" >> "$GITHUB_OUTPUT"
    # The SSH values, before anything is fetched (issue #628): each one set, the host and user well formed, a key ssh can
    # use without a passphrase, and a known_hosts line for the host. No connection: the server's forced command would
    # deploy. Messages name the input, never a value.
    - name: Check the SSH secrets
      if: inputs.send == 'true' || inputs.preflight == 'true'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        SSH_PORT: ${{ steps.release.outputs.ssh-port }}
      run: |
        failures=0
        refuse() {
          echo "::error::$1"
          failures=$((failures + 1))
        }
        for pair in "ssh-host:${SSH_HOST:-}" "ssh-user:${SSH_USER:-}" "ssh-private-key:${SSH_PRIVATE_KEY:+set}" "ssh-known-hosts:${SSH_KNOWN_HOSTS:+set}"; do
          if [ -z "${pair#*:}" ]; then refuse "${pair%%:*} is empty: the job's environment (or the repository) has no value for it."; fi
        done
        if [ -n "${SSH_HOST:-}" ] && [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then refuse "ssh-host is not a host name or address."; fi
        if [ -n "${SSH_USER:-}" ] && [[ ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then refuse "ssh-user is not a user name."; fi
        check_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ssh-check.XXXXXX")"
        trap 'rm -rf "$check_dir"' EXIT
        (
          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY:-}" > "$check_dir/key"
          printf '%s\n' "${SSH_KNOWN_HOSTS:-}" > "$check_dir/known_hosts"
        )
        if [ -n "${SSH_PRIVATE_KEY:-}" ] && ! ssh-keygen -y -P '' -f "$check_dir/key" > /dev/null 2>&1 < /dev/null; then
          refuse "ssh-private-key is not an OpenSSH private key without a passphrase."
        fi
        if [ -n "${SSH_KNOWN_HOSTS:-}" ] && [ -n "${SSH_HOST:-}" ] && [[ "$SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then
          # known_hosts names a host off port 22 as [host]:port.
          entry="$SSH_HOST"
          if [ "${SSH_PORT:-22}" != "22" ]; then entry="[$SSH_HOST]:$SSH_PORT"; fi
          if ! ssh-keygen -F "$entry" -f "$check_dir/known_hosts" > /dev/null 2>&1; then
            refuse "ssh-known-hosts has no line for the host ssh-host names (port ${SSH_PORT:-22}); the send would refuse the server."
          fi
        fi
        if (( failures > 0 )); then exit 1; fi
        echo "The SSH secrets are set: a usable key and a known host key for the server (port ${SSH_PORT:-22})."
    # Only the server files deploy-app.yml's check job anchored, so no .npmrc of the app steers npx.
    - if: inputs.send == 'true' || inputs.preflight == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.release.outputs.tag }}
        path: .softure-ai-release
        persist-credentials: false
        sparse-checkout: ${{ steps.release.outputs.server-files }}
        sparse-checkout-cone-mode: false
    - if: inputs.send == 'true' || inputs.preflight == 'true' || (inputs.verify == 'true' && steps.release.outputs.deploy-config != '')
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.release.outputs.node-version }}
    # The app's secrets and values go to the CLI's environment only; it writes the compose file's required names to
    # .env.prod (mode 0600) and prints names, never values. Names that steer Node or npm itself are refused. A value
    # in app-vars wins over a secret of the same name. A whole secrets context holds secrets the app does not pick
    # (github_token, the deploy key, an npm token): a reserved name there is left out and named instead of stopping the
    # release. With secret-names the secrets are read by name from this step's environment, which holds the env: of the
    # caller's step: only the listed names, never a variable of the runner or of this step. Then each build argument whose name .env.prod holds must carry the same value there; a difference
    # removes the file and names the variable, never a value.
    # A preflight renders the same file and stops; the last step deletes it.
    - name: Render .env.prod
      if: inputs.send == 'true' || inputs.preflight == 'true'
      shell: bash
      working-directory: .softure-ai-release
      env:
        APP_SECRETS: ${{ inputs.app-secrets }}
        SECRET_NAMES: ${{ inputs.secret-names }}
        SECRETS_FROM_ENVIRONMENT: ${{ inputs.secrets-context }}
        APP_VARS: ${{ inputs.app-vars }}
        BUILD_ARGS: ${{ steps.release.outputs.build-args }}
        SECRET_MIN_LENGTHS: ${{ steps.release.outputs.secret-min-lengths }}
        COMPOSE_FILE: ${{ steps.release.outputs.compose-file }}
        DEPLOY_CLI_VERSION: ${{ steps.release.outputs.deploy-cli-version }}
        DEPLOY_CLI: ${{ inputs.deploy-cli }}
      run: |
        node - <<'JS'
        const { spawnSync } = require("node:child_process");
        const { readFileSync, rmSync } = require("node:fs");
        const RESERVED = /^(PATH|HOME|NODE_.*|NPM_CONFIG_.*)$/i;
        function readObject(variable, input) {
          let value = null;
          try {
            value = JSON.parse(process.env[variable] ?? "");
          } catch {
            // Reported below without echoing the value.
          }
          if (value === null || typeof value !== "object" || Array.isArray(value)) {
            console.log(`::error::${input} is not a JSON object of names and values.`);
            process.exit(1);
          }
          return value;
        }
        const secrets = readObject("APP_SECRETS", "app-secrets");
        const vars = readObject("APP_VARS", "app-vars");
        // Read by name from the caller step's env: only listed names, never one the runner or this step sets.
        const RUNNER = /^(GITHUB_.*|RUNNER_.*|ACTIONS_.*|INPUT_.*|CI)$/i;
        const STEP_NAMES = new Set([
          "APP_SECRETS", "SECRET_NAMES", "SECRETS_FROM_ENVIRONMENT", "APP_VARS", "BUILD_ARGS", "SECRET_MIN_LENGTHS",
          "COMPOSE_FILE", "DEPLOY_CLI_VERSION", "DEPLOY_CLI",
        ]);
        const secretNames = (process.env.SECRET_NAMES ?? "").split(/\s+/).filter((name) => name !== "");
        if (secretNames.length > 0) {
          if (Object.keys(secrets).length > 0) {
            console.log("::error::secret-names: pass the app's secrets by name or as app-secrets, not both.");
            process.exit(1);
          }
          const problems = [];
          const seen = new Set();
          secretNames.forEach((name, index) => {
            // A token that is not a name may be a pasted value, so it is named by position only.
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) problems.push(`item ${index + 1} is not a name (letters, digits, _)`);
            else if (seen.has(name)) problems.push(`${name} is listed twice`);
            else if (RESERVED.test(name) || RUNNER.test(name)) problems.push(`${name} is reserved for the runner`);
            else if (STEP_NAMES.has(name.toUpperCase())) problems.push(`${name} is a variable of the render step itself`);
            seen.add(name);
          });
          if (problems.length > 0) {
            for (const problem of problems) console.log(`::error::secret-names: ${problem}.`);
            process.exit(1);
          }
          // An empty value counts as unset, so env render names a required one that is missing.
          for (const name of secretNames) {
            const value = process.env[name];
            if (typeof value === "string" && value !== "") secrets[name] = value;
          }
        }
        const env = { PATH: process.env.PATH, HOME: process.env.HOME };
        const overridden = [];
        const leftOut = [];
        const fromEnvironment = secretNames.length === 0 && process.env.SECRETS_FROM_ENVIRONMENT === "true";
        for (const [input, values] of [["app-secrets", secrets], ["app-vars", vars]]) {
          for (const [name, value] of Object.entries(values)) {
            if (RESERVED.test(name) && input === "app-secrets" && fromEnvironment) {
              leftOut.push(name);
              continue;
            }
            if (RESERVED.test(name)) {
              console.log(`::error::${input}: ${name} is reserved for the runner and cannot be rendered.`);
              process.exit(1);
            }
            if (typeof value !== "string") continue;
            if (input === "app-vars" && typeof secrets[name] === "string") overridden.push(name);
            env[name] = value;
          }
        }
        if (overridden.length > 0) {
          console.log(`app-vars: ${overridden.sort().join(", ")} taken from app-vars over the secret of the same name.`);
        }
        if (leftOut.length > 0) {
          console.log(`app-secrets: ${leftOut.sort().join(", ")} left out, reserved for the runner.`);
        }
        const minLengths = (process.env.SECRET_MIN_LENGTHS ?? "").split(/\s+/).filter((spec) => spec !== "");
        const args = [
          "env",
          "render",
          `--compose=${process.env.COMPOSE_FILE}`,
          "--out=.env.prod",
          ...minLengths.map((spec) => `--min-length=${spec}`),
        ];
        const cli = process.env.DEPLOY_CLI;
        const result = cli
          ? spawnSync(process.execPath, [cli, ...args], { env, stdio: "inherit" })
          : spawnSync(
              "npx",
              ["--yes", `--package=@softure-ai/deploy@${process.env.DEPLOY_CLI_VERSION}`, "softure-deploy", ...args],
              { env, stdio: "inherit" },
            );
        if (result.status !== 0) process.exit(result.status ?? 1);
        // The names env render wrote; the values compared are the ones it was given.
        const rendered = new Set();
        for (const line of readFileSync(".env.prod", "utf8").split("\n")) {
          const match = /^([A-Za-z_][A-Za-z0-9_]*)=/.exec(line);
          if (match) rendered.add(match[1]);
        }
        const compared = [];
        const differing = [];
        for (const line of (process.env.BUILD_ARGS ?? "").split("\n")) {
          const entry = line.trim();
          const at = entry.indexOf("=");
          if (at <= 0) continue;
          const name = entry.slice(0, at);
          if (!rendered.has(name)) continue;
          compared.push(name);
          if (env[name] !== entry.slice(at + 1)) differing.push(name);
        }
        if (differing.length > 0) {
          rmSync(".env.prod", { force: true });
          console.log(
            `::error::build-args and .env.prod hold different values for ${differing.join(", ")}; ` +
              "the image and the runtime must agree, so set both to the same value.",
          );
          process.exit(1);
        }
        if (compared.length > 0) console.log(`build-args and .env.prod agree on ${compared.join(", ")}.`);
        JS
    # The archive's root is what lands next to deploy.sh on the server. Only regular files and folders: a symlink in
    # the tag could point anywhere on the runner or the server. The names below are the server's own; the registry
    # token is read by deploy.sh and never installed.
    - name: Pack the release
      if: inputs.send == 'true'
      shell: bash
      working-directory: .softure-ai-release
      env:
        COMPOSE_FILE: ${{ steps.release.outputs.compose-file }}
        SERVER_SCRIPT: ${{ steps.release.outputs.server-script }}
        DEPLOY_CONFIG: ${{ steps.release.outputs.deploy-config }}
        REGISTRY_TOKEN: ${{ steps.release.outputs.registry-token == 'true' && github.token || '' }}
      run: |
        prod_dir="${COMPOSE_FILE%/*}"
        failures=0
        for file in "$COMPOSE_FILE" "$SERVER_SCRIPT" ${DEPLOY_CONFIG:+"$DEPLOY_CONFIG"}; do
          if [ ! -f "$file" ] || [ -L "$file" ]; then
            echo "::error::$file is not a file in the tag."
            failures=$((failures + 1))
          fi
        done
        odd="$(find "$prod_dir" ! -type f ! -type d 2> /dev/null || true)"
        if [ -n "$odd" ]; then
          echo "::error::$prod_dir holds something other than files and folders: ${odd//$'\n'/, }"
          failures=$((failures + 1))
        fi
        for name in .env.prod .env.prod.prev .registry-token deploy.sh deploy.json .deployed-tag .deploy.lock backups releases; do
          if [ -e "$prod_dir/$name" ]; then
            echo "::error::$prod_dir/$name is reserved on the server; rename it."
            failures=$((failures + 1))
          fi
        done
        if (( failures > 0 )); then exit 1; fi
        stage="$RUNNER_TEMP/release"
        rm -rf "$stage"
        mkdir -p "$stage"
        cp -R "$prod_dir/." "$stage/"
        cp "$SERVER_SCRIPT" "$stage/deploy.sh"
        if [ -n "$DEPLOY_CONFIG" ]; then cp "$DEPLOY_CONFIG" "$stage/deploy.json"; fi
        (umask 077 && cp .env.prod "$stage/.env.prod")
        if [ -n "${REGISTRY_TOKEN:-}" ]; then (umask 077 && printf '%s\n' "$REGISTRY_TOKEN" > "$stage/.registry-token"); fi
        # GNU tar on the runner, bsdtar on macOS (where the tests run this step): the same owner, other flag names.
        if tar --version 2> /dev/null | grep -q 'GNU tar'; then owner_flags=(--owner=0 --group=0); else owner_flags=(--uid 0 --gid 0); fi
        tar -czf release.tar.gz "${owner_flags[@]}" --numeric-owner -C "$stage" .
        rm -rf "$stage"
        echo "Packed $(tar -tzf release.tar.gz | grep -cv '/$') files for the server."
    - id: send
      name: Send the release to the server
      if: inputs.send == 'true'
      shell: bash
      working-directory: .softure-ai-release
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        SSH_PORT: ${{ steps.release.outputs.ssh-port }}
        REMOTE_COMMAND: ${{ steps.release.outputs.remote-command }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then echo "::error::ssh-host is not a host name or address."; exit 1; fi
        if [[ ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then echo "::error::ssh-user is not a user name."; exit 1; fi
        key="$RUNNER_TEMP/deploy_key"
        known_hosts="$RUNNER_TEMP/deploy_known_hosts"
        (
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
        )
        # The server prints `step|…` lines and ends with `result|ok` (init's deploy.sh, DF-9): an exit status alone
        # could come from a session cut halfway, so only that line counts as a release.
        output="$RUNNER_TEMP/deploy-output.txt"
        set -o pipefail
        ssh -i "$key" -p "$SSH_PORT" \
          -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
          -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
          "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND $TAG" < release.tar.gz | tee "$output"
        if ! grep -qx 'result|ok' "$output"; then
          echo "::error::The server did not report result|ok; the release is not confirmed (see the lines above)."
          exit 1
        fi
    # The server's step and result lines for the release report (DF-10): step names, the backup's file name and row
    # counts, never a value of .env.prod. Every kept line starts with step| or result|, so none can end the heredoc.
    - id: server-lines
      name: Keep the server's step lines
      if: always() && inputs.send == 'true'
      shell: bash
      run: |
        {
          echo "lines<<SERVER_LINES"
          grep -E '^(step|result)\|' "$RUNNER_TEMP/deploy-output.txt" 2> /dev/null || true
          echo "SERVER_LINES"
        } >> "$GITHUB_OUTPUT"
    - id: health
      name: Wait for the health route
      if: inputs.verify == 'true'
      shell: bash
      env:
        APP_URL: ${{ steps.release.outputs.app-url }}
        HEALTH_PATH: ${{ steps.release.outputs.health-path }}
        VERIFY_TIMEOUT: ${{ steps.release.outputs.verify-timeout-seconds }}
        HEALTH_STATUS: ${{ inputs.health-status }}
        HEALTH_HEADERS: ${{ inputs.health-headers }}
      run: |
        url="${APP_URL%/}$HEALTH_PATH"
        want="${HEALTH_STATUS:-200}"
        if [[ ! "$want" =~ ^[1-5][0-9][0-9]$ ]]; then
          echo "::error::Input health-status is not valid: a three-digit HTTP status such as 200 or 302"
          exit 1
        fi
        # The headers reach curl through a file only the runner's user reads, never its command line; each value is
        # masked before anything could print it, and a line is named by its number, never by its text.
        headers=()
        if [ -n "${HEALTH_HEADERS:-}" ]; then
          header_file="$RUNNER_TEMP/health-headers"
          trap 'rm -f "$header_file"' EXIT
          (umask 077 && : > "$header_file")
          header_line='^[A-Za-z0-9-]+: [^[:cntrl:]]+$'
          number=0
          while IFS= read -r line || [ -n "$line" ]; do
            number=$((number + 1))
            line="${line%$'\r'}"
            if [ -z "$line" ]; then continue; fi
            if [[ ! "$line" =~ $header_line ]]; then
              echo "::error::Input health-headers is not valid on line $number: one 'Name: value' header a line"
              exit 1
            fi
            echo "::add-mask::${line#*: }"
            printf '%s\n' "$line" >> "$header_file"
          done <<< "$HEALTH_HEADERS"
          headers=(-H "@$header_file")
        fi
        deadline=$((SECONDS + VERIFY_TIMEOUT))
        while true; do
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 ${headers[@]+"${headers[@]}"} "$url" || true)
          if [ "$status" = "$want" ]; then
            echo "verify: $url answered $want."
            exit 0
          fi
          if (( SECONDS >= deadline )); then
            echo "::error::verify: $url did not answer $want within ${VERIFY_TIMEOUT}s (last: ${status:-no answer})."
            exit 1
          fi
          echo "verify: $url answered ${status:-nothing}; retrying in 10s."
          sleep 10
        done
    # Only the config file is fetched (the leading / anchors it to the root), so no .npmrc or package.json of the app
    # steers npx. A missing or invalid file fails with the CLI's message; it is never skipped silently.
    - if: inputs.verify == 'true' && steps.release.outputs.deploy-config != ''
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.release.outputs.tag }}
        path: .softure-ai-release
        persist-credentials: false
        sparse-checkout: /${{ steps.release.outputs.deploy-config }}
        sparse-checkout-cone-mode: false
    - id: routes
      name: Verify the routes in deploy.json
      if: inputs.verify == 'true' && steps.release.outputs.deploy-config != ''
      shell: bash
      working-directory: .softure-ai-release
      env:
        APP_URL: ${{ steps.release.outputs.app-url }}
        DEPLOY_CONFIG: ${{ steps.release.outputs.deploy-config }}
        DEPLOY_CLI_VERSION: ${{ steps.release.outputs.deploy-cli-version }}
        DEPLOY_CLI: ${{ inputs.deploy-cli }}
        NODE_EXTRA_CA_CERTS: ${{ inputs.ca-file }}
        ORIGIN_ADDRESS: ${{ inputs.origin-address }}
        VERIFY_ENV: ${{ inputs.verify-env }}
        VERIFY_ENV_SECRET: ${{ inputs.verify-env-secret }}
        VERIFY_ENV_RULES: >-
          if type != "object" or any(.[]; type != "string") then "a JSON object of text values by name"
          else keys_unsorted[]
            | if test("^[A-Za-z_][A-Za-z0-9_]*$") | not then "\(.) is not a name (letters, digits, _)"
              elif ascii_upcase | test("^(APP_URL|DEPLOY_CONFIG|DEPLOY_CLI_VERSION|ORIGIN_ADDRESS|ORIGIN_ADDRESS_VAR|APP_VARS|VERIFY_ENV|VERIFY_ENV_SECRET|VERIFY_ENV_RULES|PATH|HOME|NODE_.*|NPM_CONFIG_.*)$")
              then "\(.) is reserved for the verify step or the runner"
              else empty end
          end
      run: |
        if [ -n "${NODE_EXTRA_CA_CERTS:-}" ]; then export NODE_EXTRA_CA_CERTS; else unset NODE_EXTRA_CA_CERTS; fi
        origin=()
        if [ -n "${ORIGIN_ADDRESS:-}" ]; then
          if [[ ! "$ORIGIN_ADDRESS" =~ ^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?$|^[0-9A-Fa-f:.]+$ ]]; then
            echo "::error::Input origin-address is not valid: an IP address or host with an optional :port"
            exit 1
          fi
          origin=("--origin=$ORIGIN_ADDRESS")
        fi
        variables=()
        if [ -n "${VERIFY_ENV_SECRET:-}" ] && [ -z "${VERIFY_ENV:-}" ]; then
          echo "::error::verify-env-secret: the environment (or the repository) has no secret $VERIFY_ENV_SECRET."
          exit 1
        fi
        if [ -n "${VERIFY_ENV:-}" ]; then
          input="${VERIFY_ENV_SECRET:-verify-env}"
          # An entry of a JSON secret is not masked on its own, so every line of every value is, before anything else.
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done < <(printf '%s' "$VERIFY_ENV" | jq -r '.[]? | strings' 2> /dev/null || true)
          problems="$(printf '%s' "$VERIFY_ENV" | jq -r "$VERIFY_ENV_RULES" 2> /dev/null || echo "a JSON object of text values by name")"
          if [ -n "$problems" ]; then
            while IFS= read -r problem; do echo "::error::$input is not valid: $problem"; done <<< "$problems"
            exit 1
          fi
          # The trailing x keeps a value's last new lines through $(...).
          while IFS= read -r name; do
            value="$(printf '%s' "$VERIFY_ENV" | jq -j --arg name "$name" '.[$name]'; printf x)"
            variables+=("$name=${value%x}")
          done < <(printf '%s' "$VERIFY_ENV" | jq -r 'keys_unsorted[]')
        fi
        if [ -n "${DEPLOY_CLI:-}" ]; then
          env -u VERIFY_ENV "${variables[@]}" node "$DEPLOY_CLI" verify "$APP_URL" --config="$DEPLOY_CONFIG" "${origin[@]}"
        else
          env -u VERIFY_ENV "${variables[@]}" npx --yes "--package=@softure-ai/deploy@$DEPLOY_CLI_VERSION" softure-deploy verify "$APP_URL" --config="$DEPLOY_CONFIG" "${origin[@]}"
        fi
    # The facts of this deploy for the release report (deploy-report.yml, DF-10), whatever happened: the results, the
    # image and its digest, and the server's step lines. deploy-app.yml's own summary job writes the same file for its
    # callers. A step that did not run reports skipped.
    - name: Write deploy-report.json
      if: always() && inputs.report == 'true'
      shell: bash
      env:
        TAG: ${{ steps.release.outputs.tag }}
        DEPLOY_ENVIRONMENT: ${{ steps.release.outputs.report-environment }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
        CHECK_RESULT: ${{ inputs.check-result }}
        BUILD_RESULT: ${{ inputs.build-result }}
        DEPLOY_RESULT: ${{ inputs.send != 'true' && 'skipped' || steps.send.outcome == 'success' && 'success' || 'failure' }}
        VERIFY_RESULT: ${{ inputs.verify != 'true' && 'skipped' || steps.health.outcome == 'skipped' && 'skipped' || steps.health.outcome == 'success' && steps.routes.outcome != 'failure' && 'success' || 'failure' }}
        SERVER_LINES: ${{ steps.server-lines.outputs.lines }}
      run: |
        mkdir -p "$RUNNER_TEMP/deploy-report"
        jq -n \
          --arg tag "$TAG" --arg environment "$DEPLOY_ENVIRONMENT" --arg image "$IMAGE" --arg digest "$DIGEST" \
          --arg runUrl "$RUN_URL" --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg check "$CHECK_RESULT" --arg build "$BUILD_RESULT" --arg deploy "$DEPLOY_RESULT" --arg verify "$VERIFY_RESULT" \
          --arg lines "$SERVER_LINES" \
          '{version: 1, tag: $tag, environment: $environment, image: $image, digest: $digest, runUrl: $runUrl,
            finishedAt: $finishedAt,
            jobs: [{name: "check", result: $check}, {name: "build", result: $build},
                   {name: "deploy", result: $deploy}, {name: "verify", result: $verify}],
            serverLines: ($lines | split("\n") | map(select(length > 0)))}' \
          > "$RUNNER_TEMP/deploy-report/deploy-report.json"
        cat "$RUNNER_TEMP/deploy-report/deploy-report.json"
    - if: always() && inputs.report == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: deploy-report
        path: ${{ runner.temp }}/deploy-report/deploy-report.json
        if-no-files-found: error
        overwrite: true
        retention-days: 30
    - name: Remove the key, .env.prod and the release archive
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts" "$RUNNER_TEMP/release" "$RUNNER_TEMP/deploy-output.txt" "$RUNNER_TEMP/deploy-report" .softure-ai-release/.env.prod .softure-ai-release/release.tar.gz
