# The example app's Postgres for local runs: `docker compose up -d --wait`. Port 5433, so it does not
# clash with a Postgres already on 5432. CI uses a service container instead (.github/workflows/e2e.yml).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: softure_example
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d softure_example"]
      interval: 2s
      timeout: 5s
      retries: 30
