# The caller of SOFTURE/AI's reusable deploy workflow (.github/workflows/deploy-app.yml). Copy it to the app's
# `.github/workflows/deploy.yml` and set the two domain spots (`app-url`, and `image` when the default
# ghcr.io/<owner>/<repository> does not fit) and the repository secrets named below.
#
# A published GitHub Release deploys its tag; "Run workflow" deploys an existing tag again (a rollback is a
# redeploy of an older tag). `deploy-workflows-v1` is the tag the owner moves on SOFTURE/AI; pin a commit SHA
# instead when the app wants an immutable reference.

name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        type: string
        required: true

# The ceiling of the called jobs: `build` pushes to GHCR, the rest only reads.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: SOFTURE/AI/.github/workflows/deploy-app.yml@deploy-workflows-v1
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      app-url: https://example.com
      environment: production
    secrets:
      ssh-host: ${{ secrets.DEPLOY_SSH_HOST }}
      ssh-user: ${{ secrets.DEPLOY_SSH_USER }}
      ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      # Only the names the production compose file requires (${NAME:?}) reach .env.prod. Name the secrets
      # one by one instead (a JSON object) when the repository holds many unrelated ones.
      app-secrets: ${{ toJSON(secrets) }}
