# The caller of SOFTURE/AI's reusable deploy workflow (.github/workflows/deploy-app.yml). Copy it to the app's
# `.github/workflows/deploy.yml` and set the two domain spots (`app-url`, and `image` when the default
# ghcr.io/<owner>/<repository> does not fit) and the repository secrets named below. Secrets kept in a GitHub
# environment deploy through the deploy action instead (examples/deploy-environments.yml).
#
# A published GitHub Release deploys its tag; "Run workflow" deploys an existing tag again (a rollback is a
# redeploy of an older tag). Only a tag whose commit is on the default branch deploys (`release-branch` names
# another). After every run, `report` writes the pipeline status and a deployment row into the tag's release
# (deploy-report.yml); it is the only job that may write to the repository, and only to edit the release.
# SOFTURE/AI's workflows are called at `master`; pin a commit SHA for an immutable reference,
# best the commit of the release tag `deploy@<version>` of the CLI the server runs:
# git ls-remote https://github.com/SOFTURE/AI 'refs/tags/deploy@<version>^{}'.

name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        type: string
        required: true

# The ceiling of the deploy jobs: `build` pushes to GHCR, the rest only reads. `report` sets its own.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: SOFTURE/AI/.github/workflows/deploy-app.yml@master
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      app-url: https://example.com
      environment: production
      # Non-secret values by name (switches, public settings): rendered into .env.prod like the secrets, over a
      # secret of the same name, and not masked in the logs the way a secret `1` masks every `1`.
      app-vars: ${{ toJSON(vars) }}
      # Public values baked into the image, one NAME=value per line. A name .env.prod also holds must carry the same
      # value there, or the release stops before it reaches the server:
      # build-args: |
      #   APP_ORIGIN=${{ vars.APP_ORIGIN }}
      # An image the app already built and tested, by digest from the same repository: deployed as it is, never rebuilt.
      # prebuilt-image: ghcr.io/<owner>/<repository>@sha256:<digest>
    secrets:
      ssh-host: ${{ secrets.DEPLOY_SSH_HOST }}
      ssh-user: ${{ secrets.DEPLOY_SSH_USER }}
      ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      # Behind a CDN, the server's own IP: verify fails when the firewall lets direct traffic in. Unset skips it.
      origin-address: ${{ secrets.DEPLOY_ORIGIN_IP }}
      # Variables for verify only, e.g. the key a `webBotAuth` route signs with: a secret holding a JSON object such as
      # {"WEB_BOT_AUTH_PRIVATE_KEY": "<base64 seed>"}. Unset passes nothing.
      verify-env: ${{ secrets.DEPLOY_VERIFY_ENV }}
      # Only the names the production compose file requires (${NAME:?}) reach .env.prod. toJSON(secrets) hands every
      # repository secret to the deploy job's runner, and CodeQL flags it (excessive-secrets-exposure); the deploy
      # action with secret-names (examples/deploy-environments.yml) passes the app's secrets by name instead.
      app-secrets: ${{ toJSON(secrets) }}
    # Secrets kept only in the `production` environment (its deployment policy admits release tags only) never reach
    # this job: deploy with examples/deploy-environments.yml, which passes each secret by name to the deploy action.

  report:
    needs: deploy
    if: ${{ always() }}
    permissions:
      contents: write
    uses: SOFTURE/AI/.github/workflows/deploy-report.yml@master
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
