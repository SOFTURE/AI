# Production stack of softure-example on one VPS, generated by `softure-deploy init` (@softure-ai/deploy 0.0.0).
# The app owns this file now; init never overwrites it without --force.
#
# docker/server/deploy.sh runs it on the server as `docker compose --env-file .env.prod up -d --wait`, with TAG set
# to the release tag. Every variable below in the required form (a dollar, a brace, the name, then :?) is a
# secret: the deploy workflow renders exactly these names into .env.prod with `softure-deploy env render`, so this
# file stays the one list of what production needs. A comment must not spell that form out: it would count too.
# Passwords go into connection URLs as they are: use URL-safe values, e.g. `openssl rand -hex 32`.
name: softure-example

# The off-site copy of the nightly backup (@softure-ai/backup): deploy.sh's maintain reads these names from .env.prod
# on the host; no container gets them. All are optional: without BACKUP_S3_BUCKET the step is skipped. The access key
# is a write-only token, BACKUP_AGE_RECIPIENT an age public key; the private key never comes to this server.
x-offsite-backup:
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/rules.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/rules.yml:ro
      - letsencrypt:/letsencrypt

  app:
    image: localhost:5000/softure/ai-deploy-e2e:${TAG}
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://deploy-e2e.example.com
      # The release tag for the build info route (@softure-ai/ops): the deploy's smoke check compares it with the tag.
      SOFTURE_RELEASE: ${TAG}
      DATABASE_URL: postgresql://softure_app:${SOFTURE_APP_PASSWORD:?}@postgres:5432/softure_example
      AUTH_SECRET: ${AUTH_SECRET:?}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: applies the migrations of the new image as the migrator role before the app starts. A failed
  # migration stops the deploy here; the old app container keeps serving.
  migrate:
    image: localhost:5000/softure/ai-deploy-e2e:${TAG}
    command: ["node", "migrate.mjs", "--migrations-dir", "./softure-migrations"]
    environment:
      DATABASE_URL: postgresql://softure_migrator:${SOFTURE_MIGRATOR_PASSWORD:?}@postgres:5432/softure_example
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # initdb/ creates the migrator and app roles on the first start (the @softure-ai/ops recipe). The port is
  # published on loopback only, for deploy.sh's backup, schema guard and row counts on the host.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: softure_example
      SOFTURE_MIGRATOR_PASSWORD: ${SOFTURE_MIGRATOR_PASSWORD:?}
      SOFTURE_APP_PASSWORD: ${SOFTURE_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during initdb the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d softure_example"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  letsencrypt:
  postgres-data:
