# Traefik rules of softure-example (file provider), generated by `softure-deploy init` (@softure-ai/deploy 0.0.0).
# The app owns this file now; init never overwrites it without --force. Traefik reloads it on change.
#
# The apex router serves deploy-e2e.example.com on every path; any other host or path gets Traefik's 404.
http:
  routers:
    app:
      rule: "Host(`deploy-e2e.example.com`)"
      entryPoints: [websecure]
      service: app
      middlewares: [security-headers]
      tls:
        certResolver: letsencrypt

  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    app:
      loadBalancer:
        servers:
          - url: http://app:3000
