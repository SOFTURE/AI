# Git hooks for a SOFTURE app: the same gates as CI, earlier. An app takes them with
#
#   extends:
#     - node_modules/@softure-ai/config/presets/lefthook.yml
#
# and installs them from its `prepare` script, skipped when CI is set (README). Never bypass them
# with `--no-verify`. To change a job, list a second file after this one in `extends` and name the
# job there; a job redefined in the app's own lefthook.yml keeps this file's `run` (README).
#
#   pre-commit  typecheck, ESLint on the staged files and the language gate, in parallel.
#   commit-msg  the language gate on the commit message.
#   pre-push    typecheck, the whole ESLint run, the language gate on every tracked file, then tests.
#               A push that changes only files under `context/` (workflow artifacts, roadmap state) runs the
#               language gate alone (`softure-context-only-push`; no upstream or any other file: everything runs).
#
# `glob` is the "was any code touched" switch: a commit that stages only Markdown skips typecheck
# and ESLint. The language job has no glob, so it checks Markdown too. `--max-warnings 0`: a warning
# would pass the hook and fail CI after the push.

pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,json}"
      run: npx tsc --noEmit

    # `--no-warn-ignored`: a staged file under an ignore pattern is not a warning.
    - name: lint
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,jsx}"
      run: npx eslint {staged_files} --max-warnings 0 --no-warn-ignored

    - name: language
      run: npx softure-check-language {staged_files}

# `{1}` is the file git wrote the message to.
commit-msg:
  jobs:
    - name: language
      run: npx softure-check-language --commit-msg {1}

# `piped`: the first red job stops the rest, so a type error does not wait for the whole test run.
# No `eslint --cache`: the rules are type-aware, and the cache keys a file by its own content, so a type change in
# one file would leave stale results for the files that use it.
pre-push:
  piped: true
  jobs:
    - name: typecheck
      run: npx tsc --noEmit
      skip:
        - run: npx softure-context-only-push
    - name: lint
      run: npx eslint . --max-warnings 0
      skip:
        - run: npx softure-context-only-push
    - name: language
      run: npx softure-check-language --all
    - name: test
      run: npm test
      skip:
        - run: npx softure-context-only-push
