<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Print state</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #fafafa; }
      .card { margin: 16px; width: 358px; background: repeating-linear-gradient(45deg, #0f766e 0 10px, #cff26b 10px 20px); }
      .card h2 { margin: 0; padding: 12px; height: 40px; }
      #total-row { height: 40px; background: rgb(200, 30, 30); color: #fff; }
      .chart { display: flex; gap: 4px; }
      .col { width: 40px; height: 60px; background: #333; color: #fff; }
      .spacer { height: 900px; }
    </style>
  </head>
  <body>
    <section class="card" id="card">
      <h2>Your portfolio <button class="hint">?</button> <button class="stubborn" style="display: inline-block !important">?</button></h2>
      <div id="total-row">Total 12,345</div>
      <details><summary>Bonds</summary><p>Bonds fund</p></details>
      <details><summary>Stocks</summary><p>Stocks fund</p></details>
      <details><summary>Cash</summary><p>Cash fund</p></details>
      <div class="chart">
        <div class="col">Jan</div>
        <div class="col">Feb</div>
        <div class="col">Mar</div>
        <div class="col">Apr</div>
        <div class="col">May</div>
        <div class="col">Jun</div>
      </div>
      <p class="footnote">Amounts in USD</p>
    </section>
    <div class="spacer"></div>
    <p class="outside" style="display: block !important">Far below the card</p>
    <details name="faq"><summary>First question</summary><p>First answer</p></details>
    <details name="faq"><summary>Second question</summary><p>Second answer</p></details>
  </body>
</html>
