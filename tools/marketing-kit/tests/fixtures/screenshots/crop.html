<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Crop</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      header { position: sticky; top: 0; height: 60px; background: #222; color: #fff; }
      .spacer { height: 1200px; background: linear-gradient(#eee, #ccc); }
      .card { margin: 20px 40px; width: 400px; height: 200px; background: repeating-linear-gradient(45deg, #0f766e 0 10px, #cff26b 10px 20px); }
      #last { margin-bottom: 0; height: 40px; }
    </style>
  </head>
  <body>
    <header>A sticky header</header>
    <div class="spacer"></div>
    <section class="card" id="chart"><h2>Portfolio chart</h2></section>
    <section class="card" id="other"><h2>Other card</h2></section>
    <section class="card" id="last"><h2>Last card</h2></section>
  </body>
</html>
